<!doctype html><html><head><meta charset=utf-8><title>My Weekly Budget</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Hellmodus (Standard). Kein reines Schwarz/Weiß, Akzente satt. */
:root{color-scheme:light;--bg:#F3F3F5;--ink:#141414;--muted:#5F5F66;--acc:#1B2E52;--accink:#F7F7F9;--sd:rgba(166,166,174,.55);--sl:#FDFDFE;--beige:#CFAE78;--ok:#1f9d55;--okt:#177A42;--warn:#E8890C;--warnt:#9A5200;--bad:#C62828;--c3:#5E6F94;--c4:#A9A9B1;--line:rgba(20,20,20,.38);--hero-ink:#F7F7F9;--pill:#F3F3F5}
/* Dunkelmodus nur auf Wunsch (data-theme="dark"): Akzente gedämpft */
:root[data-theme="dark"]{color-scheme:dark;--bg:#1B1B1D;--ink:#EDEDEF;--muted:#A9A9B0;--acc:#93A6CC;--accink:#141826;--sd:#0F0F10;--sl:#29292C;--beige:#CBB591;--ok:#4FB57E;--okt:#62C690;--warn:#D9984A;--warnt:#E6A85C;--bad:#EE7A7A;--c3:#7F8FB2;--c4:#85858C;--line:rgba(237,237,239,.42);--pill:#EDEDEF}
:root{--top:0px;--raise:6px 6px 16px var(--sd),-6px -6px 16px var(--sl);--raise-s:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);--inset:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);--navy:radial-gradient(circle at 80% 12%,rgba(255,255,255,.2),transparent 55%),linear-gradient(150deg,#1B2E52 -30%,#141414 100%);--tap:44px}
@media (pointer:coarse){:root{--top:calc(env(safe-area-inset-top,0px) + 12px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:.875rem;line-height:1.45;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;padding:var(--top) 0 calc(112px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:16px 24px 8px}
header b{font-size:1.2rem;letter-spacing:-.01em}
.day{font-size:.82rem;font-weight:700;color:var(--ink);padding:8px 16px;border-radius:99px;box-shadow:var(--raise-s),inset 0 0 0 2px var(--beige);white-space:nowrap}
nav{position:sticky;isolation:isolate;top:calc(8px + var(--top));margin:0 24px 16px;padding:4px;display:flex;gap:4px;border-radius:99px;background:var(--bg);box-shadow:var(--raise);z-index:10}
nav button{position:relative;z-index:1;flex:1;min-width:0;min-height:var(--tap);font:inherit;font-size:min(.82rem,4.1vw);font-weight:600;line-height:1.2;color:var(--muted);background:transparent;border:0;border-radius:99px;padding:8px 4px;cursor:pointer}
nav button.on{color:var(--accink)}
#ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 16px) / 3);border-radius:99px;background:var(--acc);box-shadow:0 6px 14px rgba(18,24,40,.3);will-change:transform;pointer-events:none}
#wrap{overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#track{display:flex;width:300%;align-items:flex-start;will-change:transform;backface-visibility:hidden}
.panel{flex:0 0 33.3333%;min-width:0;padding:8px 24px 24px}
/* Hero mit Ring */
.hero{color:var(--hero-ink);border-radius:32px;padding:24px;margin-bottom:24px;background:var(--navy);box-shadow:0 16px 32px rgba(18,24,40,.35)}
.hero>small{font-weight:600;font-size:.875rem;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.ring{--rs:clamp(128px,38vw,168px);width:var(--rs);height:var(--rs);flex:none;position:relative}
.ring svg{display:block;width:100%;height:100%}
.ring circle{transition:stroke-dasharray .4s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20%}
.ring .c b{font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring .c small{font-size:max(12px,calc(var(--rs) * .074));opacity:.85;white-space:nowrap}
.hinfo{flex:1 1 7rem;min-width:7rem;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hinfo .lbl{font-size:.8rem;font-weight:600;opacity:.88}
.hinfo .val{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:-4px}
.pct{background:var(--pill);border-radius:99px;padding:8px 12px;font-size:.8rem;font-weight:800;white-space:nowrap;box-shadow:3px 3px 8px rgba(0,0,0,.35),-2px -2px 6px rgba(255,255,255,.14)}
.pct.g{color:#177A42}.pct.o{color:#9A5200}.pct.r{color:#C62828}
.clock{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:99px;padding:8px 12px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Karten */
.card{background:var(--bg);border-radius:24px;padding:16px;margin-bottom:24px;box-shadow:var(--raise)}
h3{margin:0 0 8px;font-size:1rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
h3 .muted{font-weight:600}
.muted{color:var(--muted);font-size:.875rem}
.small{font-size:.78rem}
.big2{font-size:1.5rem;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--okt);font-weight:700;white-space:nowrap}.neg{color:var(--bad);font-weight:700;white-space:nowrap}
.row{display:flex;gap:8px}
.empty{display:flex;gap:16px;align-items:center;padding:8px 0}
.empty .tile{color:var(--acc)}
/* Formulare: Label immer über dem Feld */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:.875rem;font-weight:600;margin-bottom:8px;text-align:left}
.fld .hint{display:block;font-size:.78rem;color:var(--muted);font-weight:400;margin-top:4px}
.err{display:block;color:var(--bad);font-size:.8rem;font-weight:600;margin-top:4px}
.err:empty{display:none}
input{width:100%;min-height:var(--tap);font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:0;border-radius:16px;padding:12px 16px;box-shadow:var(--inset);user-select:text;-webkit-user-select:text}
input[aria-invalid="true"]{box-shadow:var(--inset),0 0 0 2px var(--bad)}
input::placeholder{color:var(--muted);opacity:.85}
.money{position:relative;display:block}
.money input{padding-right:40px;font-variant-numeric:tabular-nums}
.money i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;color:var(--muted);pointer-events:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--beige);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font:inherit;font-size:1rem;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:12px 24px;cursor:pointer;box-shadow:0 8px 16px rgba(18,24,40,.28)}
.btn.soft{background:var(--bg);color:var(--ink);box-shadow:var(--raise-s)}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn[disabled]{opacity:.6}
.wide{width:100%;margin-top:16px;white-space:normal;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);font:inherit;font-size:.875rem;font-weight:600;color:var(--ink);background:var(--bg);border:0;border-radius:99px;padding:8px 16px;cursor:pointer;box-shadow:var(--raise-s)}
.chip.sel{background:var(--acc);color:var(--accink)}
.chip.del{color:var(--bad);box-shadow:var(--raise-s),inset 0 0 0 2px var(--bad)}
.link{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:var(--tap);margin:8px auto 0;font:inherit;font-size:.875rem;font-weight:600;color:var(--muted);text-decoration:underline;background:none;border:0;cursor:pointer;padding:0 8px}
.link.c{display:flex}
button,input,label{touch-action:manipulation}
/* Tipp-Feedback: nur transform, 120 ms */
.chip,.btn,.lock,.plan,nav button,.rm,.link,.xh,#push{transition:transform .12s ease}
.chip:active,.btn:active,.lock:active,.plan:active,nav button:active,.rm:active,.link:active,#push:active{transform:scale(.97)}
.xh:active{transform:scale(.99)}
.bar{height:12px;border-radius:99px;background:var(--bg);box-shadow:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin-top:8px;font-size:.875rem}
.ic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.mi{vertical-align:-5px;flex:none}
/* Streak + Medaillen */
.streak{display:flex;align-items:center;gap:16px}
.streak .t{flex:1;min-width:0}
.streak .t b{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5rem,1fr));gap:8px;margin-top:8px}
.m{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 4px;border-radius:16px;box-shadow:var(--inset);opacity:.65}
.m .e{display:block;line-height:0;filter:grayscale(1)}
.m b{font-size:.78rem;line-height:1.25;overflow-wrap:anywhere;hyphens:auto}
.m small{font-size:.75rem;color:var(--muted)}
.m.on{box-shadow:var(--raise-s);opacity:1}
.m.on .e{filter:none}
/* Aufklappbare Karten */
.xc{background:var(--bg);border-radius:24px;margin-bottom:24px;box-shadow:var(--raise)}
.xh{display:block;width:100%;min-height:var(--tap);text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:24px;padding:16px;cursor:pointer}
.xt{display:flex;align-items:center;gap:16px}
.xt .t{flex:1;min-width:0}
.xt .t b{display:block;font-size:1rem}
.xt .t small{display:block;color:var(--muted);font-size:.8rem}
.chev{transition:transform .2s ease;color:var(--muted)}
.chevw{width:var(--tap);height:var(--tap);display:grid;place-items:center;flex:none;margin:-8px -8px -8px 0;border-radius:50%}
.xc.open .chev{transform:rotate(180deg)}
.xsum{display:block;margin-top:8px}
.xc.open .xsum{display:none}
.xb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .2s ease,opacity .2s ease}
.xc.open .xb{grid-template-rows:1fr;opacity:1}
.xb>div{overflow:hidden;min-height:0}
.xin{padding:0 16px 16px}
.sl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font-size:.875rem}
.sl+.sl{margin-top:8px}
/* Einträge */
.ex{display:flex;align-items:center;gap:8px;padding:8px 0}
.ex .n{flex:1;min-width:0;margin-left:4px}
.ex .n b{display:block;font-size:.92rem;font-weight:600;overflow-wrap:anywhere}
.ex .n small{display:block;color:var(--muted);font-size:.78rem}
.ex .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:var(--raise-s)}
.rm{font:inherit;color:var(--bad);background:var(--bg);border:0;border-radius:99px;width:var(--tap);height:var(--tap);display:grid;place-items:center;cursor:pointer;box-shadow:var(--raise-s);flex:none}
/* Wochenverlauf */
.wk{position:relative;height:120px;display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.wk .col{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end;height:100%}
.wk .b{width:100%;max-width:32px;border-radius:8px;background:var(--acc);transition:height .4s}
.wk .b.over{background:var(--warn)}
.wk .b.fut{background:none;border:2px dashed var(--c4)}
.wk .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--line);pointer-events:none}
.wkl{display:flex;gap:8px;margin-top:8px}
.wkl span{flex:1;min-width:0;text-align:center;font-size:.75rem;color:var(--muted)}
.wkl span.td{color:var(--ink);font-weight:800}
.mini{display:flex;gap:8px}
.mini>span{flex:1;min-width:0;display:block}
.mini small{display:block;font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.bar.s{height:8px}
.bar i.cur{background:var(--beige)}
.bar i.bad{background:var(--bad)}
.wrow+.wrow{margin-top:16px}
.seg{display:flex;height:16px;border-radius:99px;overflow:hidden;box-shadow:var(--inset);background:var(--bg)}
.seg i{display:block;height:100%}
.leg{display:flex;align-items:center;gap:8px;font-size:.875rem;margin-top:8px}
.leg .d{width:12px;height:12px;border-radius:50%;flex:none}
.leg span:nth-child(2){flex:1;min-width:0}
.lock{gap:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:var(--tap);font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:24px;padding:16px;margin-bottom:16px;cursor:pointer;box-shadow:var(--raise-s)}
.fine{text-align:center;margin-top:8px;font-size:.78rem}
/* Hauptaktion im Daumenbereich */
#fab{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));max-width:430px;margin:0 auto;background:linear-gradient(to top,var(--bg) 60%,rgba(243,243,245,0));pointer-events:none}
:root[data-theme="dark"] #fab{background:linear-gradient(to top,var(--bg) 60%,rgba(27,27,29,0))}
#fab .btn{width:100%;pointer-events:auto}
#fab[hidden]{display:none}
#push{position:fixed;left:16px;right:16px;top:calc(8px + var(--top));max-width:398px;margin:0 auto;z-index:40;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:24px;padding:16px;cursor:pointer;box-shadow:var(--raise)}
#push[hidden]{display:none}
#push small{color:var(--muted);font-weight:600;font-size:.75rem;letter-spacing:.04em}
.warnbox{padding:16px;border-radius:16px;font-size:.875rem;box-shadow:var(--inset),0 0 0 2px var(--warn)}
.warnbox .ic{color:var(--warnt)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;border-radius:32px 32px 0 0;padding:24px 24px calc(32px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:1.1rem}
.steps{display:flex;gap:8px;margin:0 0 16px}
.steps i{flex:1;height:6px;border-radius:99px;box-shadow:var(--inset)}
.steps i.on{background:var(--acc);box-shadow:none}
.plans{display:flex;gap:8px;margin:16px 0 8px}
.plan{position:relative;flex:1;min-width:0;font:inherit;color:var(--ink);text-align:left;background:var(--bg);border:0;border-radius:24px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:0;box-shadow:var(--raise-s)}
.plan.sel{box-shadow:var(--inset),0 0 0 2px var(--acc)}
.plan b{font-size:.95rem}
.plan span{font-size:1.25rem;font-weight:800;line-height:1.2}
.plan small{color:var(--muted);font-size:.78rem;margin-top:4px}
.plan .pop{font-style:normal;align-self:flex-start;background:var(--beige);color:#141414;font-size:.75rem;font-weight:800;border-radius:99px;padding:2px 8px;margin-bottom:8px}
.fabon .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-size:.875rem;z-index:30;max-width:90%;text-align:center}
nav button{transition:transform .12s ease,color .25s ease}
@media (prefers-reduced-motion:reduce){#wrap,#track,#ind,.bar i,.xb,.chev,.wk .b,.ring circle,.chip,.btn,.lock,.plan,nav button,.rm,.link,.xh,#push{transition:none!important}.chip:active,.btn:active,.lock:active,.plan:active,nav button:active,.rm:active,.link:active,.xh:active,#push:active{transform:none}}
</style>
<div class="app">
  <header><b>My Weekly Budget</b><span class="day" id="day"></span></header>
  <nav>
    <span id="ind" aria-hidden="true"></span>
    <button onclick="setTab(0)">Übersicht</button>
    <button onclick="setTab(1)">Mein Monat</button>
    <button onclick="setTab(2)">Sparen</button>
  </nav>
  <div id="wrap"><div id="track">
    <section class="panel" id="p0"></section>
    <section class="panel" id="p1"></section>
    <section class="panel" id="p2"></section>
  </div></div>
</div>
<div id="fab"><button class="btn" id="fabbtn" onclick="expForm()"></button></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Hinweis"></div></div>
<button id="push" hidden onclick="openPush()"><small>MY WEEKLY BUDGET · MO 00:01</small><span id="pushtxt"></span></button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

const D=864e5,DN=['So','Mo','Di','Mi','Do','Fr','Sa'];

/* ---------- Zustand ---------- */
const SCHEMA=4,KEY='dc3';
const DEF=()=>({schemaVersion:SCHEMA,setupDone:false,income:900,fixed:450,save:100,min:1,goal:300,saved:0,carry:0,pending:0,streak:0,best:0,plan:'y',paySeen:false,edit:false,wkN:1,wkTs:weekStart(),medalQ:null,
  items:[{n:'Cola Zero',p:1,c:'Getränke'},{n:'Kaffee',p:2.8,c:'Getränke'},{n:'Mensa',p:5.5,c:'Essen'}],ex:[],weeks:[],dep:[]});
const S=DEF();
const num=(v,d)=>typeof v==='number'&&Number.isFinite(v)?v:d;
const catOk=c=>CAT[c]?c:'Sonstiges';
/* Gespeicherte Werte mit den Standardwerten zusammenführen – nie verwerfen */
function migrate(o){
  const d=DEF(),m={...d};
  for(const k of Object.keys(d)){if(!(k in o))continue;const v=o[k],t=d[k];
    if(typeof t==='number')m[k]=num(v,t);else if(typeof t==='boolean')m[k]=typeof v==='boolean'?v:t;
    else if(typeof t==='string')m[k]=typeof v==='string'?v:t;else if(Array.isArray(t))m[k]=Array.isArray(v)?v:t;else m[k]=v}
  m.items=m.items.filter(x=>x&&typeof x.n==='string').map(x=>({n:x.n,p:num(x.p,0),c:catOk(x.c)})).filter(x=>x.p>0);
  m.ex=m.ex.filter(x=>x&&typeof x.n==='string').map(x=>({n:x.n,p:num(x.p,0),q:Math.max(1,num(x.q,1)),c:catOk(x.c),ts:num(x.ts,Date.now()),w:num(x.w,m.wkN)}));
  m.dep=m.dep.filter(x=>x&&Number.isFinite(x.a)).map(x=>({ts:num(x.ts,Date.now()),n:String(x.n||'Einzahlung'),a:x.a}));
  m.weeks=m.weeks.filter(x=>x&&Number.isFinite(x.ts));
  if(m.medalQ!==null&&!Number.isInteger(m.medalQ))m.medalQ=null;
  if(m.goal<=0)m.goal=d.goal;
  /* v3 kannte noch keine Einrichtung: bestehende Nutzer haben sie schon hinter sich */
  if(!('schemaVersion' in o))m.setupDone=true;
  m.schemaVersion=SCHEMA;return m;
}
let store=null;try{store=window.localStorage;store.setItem('__t','1');store.removeItem('__t')}catch(_){store=null}
(()=>{if(!store)return;let raw=null;try{raw=store.getItem(KEY)}catch(_){}
  if(raw){try{Object.assign(S,migrate(JSON.parse(raw)));return}catch(_){try{store.setItem(KEY+'_backup',raw)}catch(__){}}}
  /* Spielstand der Vorversion übernehmen: Streak und Rekord gelten als Wochen */
  try{const o=JSON.parse(store.getItem('dc')||'null');if(!o)return;
    const m={};['income','fixed','save','min','saved','carry','pending','streak','best','plan','paySeen'].forEach(k=>{if(k in o)m[k]=o[k]});
    if(Array.isArray(o.items))m.items=o.items;
    if(Array.isArray(o.log)&&o.wkTs===S.wkTs)m.ex=o.log.map(x=>({n:x.n,p:x.p,q:x.q||1,c:'Sonstiges',ts:Date.now(),w:S.wkN}));
    Object.assign(S,migrate(m));

/* Beträge: Komma und Punkt erlaubt, Ausgabe als 0,00 */
function parseMoney(v){
  let s=String(v==null?'':v).replace(/€/g,'').replace(/\s/g,'');if(!s)return {e:'empty'};
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(s)&&!/^\.\d{1,2}$/.test(s))return {e:'nan'};
  return {v:Math.round(parseFloat(s)*100)/100};
}

const avail=()=>Math.max(0,S.income-S.fixed-S.save);

const sum=a=>a.reduce((s,x)=>s+x.p*x.q,0);

const left=()=>r2(budget()-spentW());
const daysLeft=()=>{const d=new Date().getDay();return d===0?1:8-d};

}

function setOpen(id,o){const c=document.getElementById(id);if(!c)return;c.classList.toggle('open',o);c.querySelector('.xh').setAttribute('aria-expanded',String(o));c.querySelector('.xb').inert=!o}
function tog(id){const t=+id[1],was=OPEN[t]===id;if(OPEN[t]&&!was)setOpen(OPEN[t],false);setOpen(id,!was);OPEN[t]=was?null:id}
const tile=c=>`<span class="tile" style="color:${CAT[c].c}">${ic(CAT[c].i,18)}</span>`;
function exRow(x,i,today){
  return `<div class="ex">${tile(x.c)}<span class="n"><b>${x.q>1?x.q+'× ':''}${esc(x.n)}</b><small>${today?hm(x.ts):DN[new Date(x.ts).getDay()]+' · '+hm(x.ts)} · ${x.c}</small></span><span class="a">−${eur(x.p*x.q)}</span>${i>=0?`<button class="rm" onclick="undo(${i})" aria-label="${esc(x.n)} löschen">${ic('x',14)}</button>`:''}</div>`;
}
const cdText=()=>{const s=Math.max(0,Math.floor((atDay(weekStart(),7)-Date.now())/1000)),p=v=>String(v).padStart(2,'0');return `${Math.floor(s/86400)} T ${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}`};
const clock=()=>`<span class="clock">${ic('clock',14)}<span class="cd">${cdText()}</span></span>`;
function streakCard(){
  const nx=MED.find(x=>x[0]>S.streak),pct=nx?Math.min(100,S.streak/nx[0]*100):100,ni=nx?MED.indexOf(nx):MED.length-1;
  const t=S.streak?`${wk(S.streak)} Streak`:'Noch keine Streak';
  return `<section class="card"><div class="streak">${mi(ni,48)}<span class="t"><b>${t}</b><span class="muted">${nx?`Noch ${wk(nx[0]-S.streak)} bis ${nx[1]}`:'Alle Medaillen geschafft!'}</span></span></div>
    <div class="bar" style="margin-top:16px"><i style="width:${pct}%"></i></div>
    <div class="meta"><span class="muted">Rekord ${wk(S.best)}</span><button class="link" style="margin:0" onclick="setTab(2)">Medaillen ›</button></div></section>`;
}
function warn(st=''){
  if(S.fixed+S.save>S.income)return `<div class="warnbox" role="alert" style="${st}">${ic('warn',18)} Fixkosten und Sparziel (${eur(S.fixed+S.save)}) liegen über deinem Einkommen. Dein Wochenbudget ist 0 €.</div>`;
  const l=left();
  if(wbase()>0&&(l<=0||perDay()<S.min))return `<div class="warnbox" role="alert" style="${st}">${ic('warn',18)} ${l<0?`Du liegst diese Woche ${eur(-l)} über dem Budget.`:l===0?'Dein Wochenbudget ist aufgebraucht.':`Nur noch ${eur(perDay())} pro Tag bis Montag.`}</div>`;

const emptyBox=(t,s)=>`<div class="empty">${tile('Sonstiges').replace('var(--c4)','var(--acc)')}<span><b style="display:block">${t}</b><span class="muted">${s}</span></span></div>`;

/* ---------- Übersicht ---------- */
function weekChart(){
  const now=new Date(),ti=(now.getDay()+6)%7,v=[0,0,0,0,0,0,0];
  weekEx().forEach(x=>{v[(new Date(x.ts).getDay()+6)%7]+=x.p*x.q});
  const tw=base(),mx=Math.max(...v,tw)*1.15||1,H=120,h=a=>Math.max(6,Math.round(a/mx*H));
  const cols=v.map((a,i)=>i>ti?`<span class="col"><i class="b fut" style="height:${h(tw)}px"></i></span>`:`<span class="col"><i class="b${a>tw&&tw>0?' over':''}" style="height:${h(a)}px" title="${eur(a)}"></i></span>`).join('');
  const sr=v.map((a,i)=>`${['Mo','Di','Mi','Do','Fr','Sa','So'][i]} ${i>ti?'–':eur(a)}`).join(', ');
  return `<div class="wk" role="img" aria-label="Ausgaben pro Tag: ${sr}">${cols}${tw>0?`<i class="ln" style="bottom:${h(tw)}px"></i>`:''}</div>
    <div class="wkl" aria-hidden="true">${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<span class="${i===ti?'td':''}">${d}</span>`).join('')}</div>
    <div class="muted small" style="margin-top:8px">Gestrichelt: Tageswert ${eur(tw)}</div>`;
}
function uebersicht(){
  const l=left(),b=budget(),p=pctOf(l,b),we=weekEx(),td=atDay(Date.now());
  const today=we.filter(x=>x.ts>=td),ts=sum(today),last=today[today.length-1];
  const list=S.ex.map((x,i)=>[x,i]).filter(([x])=>x.w===S.wkN).reverse();
  const tip='Tippe unten auf „Ausgabe eintragen“. Gespeicherte Ausgaben trägst du dort mit einem Tipp ein.';
  return hero('Diese Woche noch übrig',ring(b>0?l/b:0,eur(l),'von '+eur(b)),
    `<span class="lbl">Pro Tag</span><span class="val">${eur(perDay())}</span><span class="pct ${pcls(p)}">${p} % frei</span>${clock()}`)
  +(S.pending>0?`<section class="card"><h3>Rest der letzten Woche</h3><div class="muted">${eur(S.pending)} warten auf deine Entscheidung.</div><button class="btn wide" onclick="ask()">Jetzt entscheiden</button></section>`:'')
  +warn('margin-bottom:24px')
  +`<section class="card"><h3><span>Wochenverlauf</span><span class="muted">${eur(spentW())} ausgegeben</span></h3>${we.length?'':emptyBox('Noch keine Ausgaben diese Woche','Dein volles Wochenbudget steht bereit. '+tip)}${weekChart()}</section>`
  +streakCard()
  +xcard('x0a','Heute',today.length?'Antippen für alle Einträge der Woche':'Antippen für Details',
    `<span class="sl"><b>${today.length===1?'1 Eintrag':today.length+' Einträge'} · ${eur(ts)}</b></span>${last?`<span class="sl muted" style="margin-top:8px"><span>Zuletzt: ${last.q>1?last.q+'× ':''}${esc(last.n)} · ${hm(last.ts)}</span><span>−${eur(last.p*last.q)}</span></span>`:'<span class="muted" style="display:block;margin-top:8px">Noch keine Ausgabe heute – gut so!</span>'}`,
    list.length?list.map(([x,i])=>exRow(x,i,x.ts>=td)).join(''):emptyBox('Noch keine Ausgabe diese Woche',tip));
}

/* ---------- Mein Monat ---------- */
function monat(){
  const a=avail(),me=monthEx(),sp=r2(sum(me)),rest=r2(a-sp),p=pctOf(rest,a),dl=mDays()-new Date().getDate()+1;
  const cur={ts:S.wkTs,kw:kw(S.wkTs),b:budget(),s:spentW(),cur:1},all=[...S.weeks.slice(-5),cur];
  const wline=w=>{const f=w.b>0?Math.min(100,w.s/w.b*100):0,neg=w.s>w.b+.004;
    return `<div class="wrow"><div class="sl"><span><b>W${w.kw}</b> <span class="muted">${dm(w.ts)}–${dm(atDay(w.ts,6))}</span></span>${w.cur?'<span class="muted">läuft</span>':neg?`<span class="neg">−${eur(w.s-w.b)}</span>`:`<span class="pos">+${eur(w.b-w.s)}${w.r==='save'?' gespart':w.r==='carry'?' übertragen':''}</span>`}</div>
    <div class="bar s" style="margin-top:8px"><i class="${w.cur?'cur':neg?'bad':''}" style="width:${neg?100:f}%"></i></div><div class="muted small" style="margin-top:4px">${eur(w.s)} von ${eur(w.b)}</div></div>`};
  const ct=CATS.map(c=>[c,r2(sum(me.filter(x=>x.c===c)))]).filter(x=>x[1]>0),segs=ct.map(([c,v])=>`<i style="width:${v/sp*100}%;background:${CAT[c].c}"></i>`).join('');
  const segbar=`<span class="seg" role="img" aria-label="${ct.map(([c,v])=>c+' '+eur(v)).join(', ')||'Keine Ausgaben'}">${segs}</span>`;
  return hero(`${monthName()} noch übrig`,ring(a>0?rest/a:0,eur(rest),'von '+eur(a)),
    `<span class="lbl">Pro Tag · ${dl===1?'1 Tag':dl+' Tage'}</span><span class="val">${eur(Math.max(0,Math.floor(rest/dl*100)/100))}</span><span class="pct ${pcls(p)}">${p} % frei</span>`)
  +(S.fixed+S.save>S.income?warn('margin-bottom:24px'):'')
  +xcard('x1a','So kommt dein Budget zustande','Antippen für Details',
    `<span class="sl"><span class="muted">${eur0(S.income)} − ${eur0(S.fixed)} − ${eur0(S.save)}</span><span class="big2">${eur(a)}</span></span>`,
    `<div class="sl"><span>Einkommen</span><span>${eur(S.income)}</span></div><div class="sl"><span>Fixkosten</span><span>−${eur(S.fixed)}</span></div><div class="sl"><span>Sparziel</span><span>−${eur(S.save)}</span></div>
     <div class="sl" style="border-top:1px solid var(--c4);padding-top:8px;margin-top:8px"><b>Verfügbar im Monat</b><span class="big2" style="font-size:1.25rem">${eur(a)}</span></div>
     <div class="muted" style="margin-top:8px">Pro Woche ${eur(wbase())} · pro Tag ${eur(base())} (${mDays()} Tage)</div>`)
  +xcard('x1b','Wochen im Überblick',`Streak ${S.streak}`,
    `<span class="mini">${all.slice(-3).map(w=>`<span><small>W${w.kw}</small><span class="bar s" style="display:block"><i class="${w.cur?'cur':w.s>w.b+.004?'bad':''}" style="width:${w.b>0?Math.min(100,w.s/w.b*100):0}%"></i></span></span>`).join('')}</span>`,
    all.slice().reverse().map(wline).join('')+(S.weeks.length?'':'<div class="muted" style="margin-top:16px">Nach deinem ersten Wochenwechsel am Montag siehst du hier, wie deine Wochen gelaufen sind.</div>'))
  +xcard('x1c','Wohin das Geld ging',`${eur(sp)} ausgegeben`,sp>0?segbar:'<span class="muted">Noch keine Ausgaben in diesem Monat.</span>',
    sp>0?segbar+ct.map(([c,v])=>`<div class="leg"><span class="d" style="background:${CAT[c].c}"></span><span>${c}</span><b>${eur(v)}</b></div>`).join(''):emptyBox('Noch keine Ausgaben in diesem Monat','Sobald du etwas einträgst, siehst du hier die Aufteilung nach Essen, Einkauf, Getränke und Sonstiges.'))
  +`<button class="btn soft wide" style="margin:0 0 24px" onclick="settings()">Einkommen & Ziele ändern</button>
  <button class="lock" onclick="pay()"><span>Schwankt dein Einkommen? Unregelmäßiges Einkommen gibt es mit Premium.</span>${ic('lock')}</button>
  <div class="chips" style="margin-top:0"><button class="chip" onclick="demo()">Demo: Streak auf Woche 7</button><button class="chip" onclick="rollover()">Demo: Wochenwechsel simulieren</button><button class="chip" onclick="demoData()">Demo-Daten laden</button></div>`;
}

/* ---------- Sparen ---------- */
function sparen(){
  const g=S.goal,p=pctOf(S.saved,g),got=MED.filter(m=>S.best>=m[0]).length,nx=MED.find(x=>x[0]>S.streak),ni=nx?MED.indexOf(nx):MED.length-1;
  const dep=S.dep.slice().reverse(),ms=monthStart(),mSum=r2(S.dep.filter(x=>x.ts>=ms).reduce((s,x)=>s+x.a,0));

    `<span class="lbl">Sparziel</span><span class="val">${eur(g)}</span><span class="pct g">${p} % erreicht</span><span class="clock">${S.saved>=g?'Ziel erreicht':'noch '+eur(r2(g-S.saved))}</span>`)
  +`<section class="card"><h3><span>Am Montag entscheidest du</span><span class="muted" style="display:inline-flex;align-items:center;gap:8px">${ic('clock',14)}<span class="cd">${cdText()}</span></span></h3>
    <div class="muted">Aktueller Wochenrest: aufs Sparkonto oder in die nächste Woche?</div><div class="big2" style="margin-top:8px">${eur(Math.max(0,left()))}</div></section>`
  +xcard('x2a',nx?`${nx[1]} bei Woche ${nx[0]}`:'Alle Medaillen geschafft',`${S.streak?wk(S.streak)+' Streak':'Noch keine Streak'} · ${got} von ${MED.length} Medaillen`,
    `<span class="streak">${mi(ni,44)}<span class="t"><span class="bar" style="display:block"><i style="width:${nx?Math.min(100,S.streak/nx[0]*100):100}%"></i></span><span class="muted" style="display:block;margin-top:8px">${nx?`Noch ${wk(nx[0]-S.streak)}`:'Rekord '+wk(S.best)}</span></span></span>`,
    `<div class="mgrid">${MED.map((m,i)=>{const on=S.best>=m[0];return `<div class="m ${on?'on':''}"><span class="e">${mi(i,46)}</span><b>${m[1]}</b><small>${on?'ab Woche '+m[0]:'noch '+wk(m[0]-S.streak)}</small></div>`}).join('')}</div>
     <div class="muted" style="margin-top:16px">Jede Marke zählt Wochen in Folge, in denen du im Budget bleibst. Rekord: ${wk(S.best)}.</div>`)
  +xcard('x2b','Einzahlungen',dep.length?`Diesen Monat +${eur(mSum)}`:'Antippen für Details',
    dep.length?`<span class="sl"><span>${esc(dep[0].n)} <span class="muted">· ${dm(dep[0].ts)}</span></span><span class="pos">+${eur(dep[0].a)}</span></span>`:'<span class="muted">Noch keine Einzahlung.</span>',
    dep.length?dep.map(x=>`<div class="sl" style="padding:4px 0"><span>${esc(x.n)} <span class="muted">· ${dm(x.ts)}</span></span><span class="pos">+${eur(x.a)}</span></div>`).join(''):emptyBox('Noch keine Einzahlung','Am Montag kannst du deinen Wochenrest aufs Sparkonto legen – oder unten direkt etwas einzahlen.'))
  +`<button class="btn wide" style="margin:0 0 24px" onclick="depForm()">${ic('plus',16)} Auf Sparkonto einzahlen</button>
  <button class="lock" onclick="pay()"><span>${ic('plus')} Weitere Sparziele</span><span>${ic('lock')} Premium</span></button>
  <button class="lock" onclick="pay()"><span>${ic('chart')} Statistik nach Kategorien</span><span>${ic('lock')} Premium</span></button>`;
}

/* ---------- Aktionen ---------- */
function render(all){
  $('#day').textContent='Woche '+kw(Date.now());
  /* immer alle Seiten aktuell halten, damit beim Wischen nichts nachspringt */
  [uebersicht,monat,sparen].forEach((f,i)=>{$('#p'+i).innerHTML=f()});
  save();navUpd();
}
function spend(n,p,q,c){S.ex.push({n,p,q,c,ts:Date.now(),w:S.wkN});render()}
function qtyOk(v){const s=String(v).trim();if(!/^\d{1,3}$/.test(s)||+s<1||+s>99)return 0;return +s}
function use(i){
  const x=S.items[i];if(!x||!once('chip'))return;
  const q=qtyOk(($('#fq')||{}).value||'1');if(!showErr('fq',q?'':'Menge bitte als ganze Zahl zwischen 1 und 99.'))return;
  closeM();spend(x.n,x.p,q,x.c||'Sonstiges');toast(`${q>1?q+'× ':''}${x.n} eingetragen`);
}
function del(i){S.items.splice(i,1);save();$('#saved').innerHTML=savedChips()}
const savedChips=()=>S.items.length?`<div class="meta" style="margin-top:0"><b>Gespeichert – ein Tipp trägt ein</b><button class="link" style="margin:0" onclick="S.edit=!S.edit;save();$('#saved').innerHTML=savedChips()">${S.edit?'Fertig':'Bearbeiten'}</button></div>
    <div class="chips" style="margin:8px 0 16px">${S.items.map((x,i)=>`<button class="chip${S.edit?' del':''}" onclick="${S.edit?`del(${i})`:`use(${i})`}"${S.edit?` aria-label="${esc(x.n)} löschen"`:''}>${esc(x.n)} ${eur(x.p)}${S.edit?' '+ic('x',14):''}</button>`).join('')}</div>`:'';
function undo(i){if(!once('undo'))return;const x=S.ex.splice(i,1)[0];render();if(x)toast(`${x.n} gelöscht`)}
let fCat='Sonstiges';
function expForm(){
  fCat='Sonstiges';
  S.edit=false;
  modal(`<h3>Ausgabe eintragen</h3>
    <div id="saved">${savedChips()}</div>
    <label class="fld"><span>Name</span><input id="nm" type="text" placeholder="z. B. Cola Zero" maxlength="40" autocomplete="off" aria-describedby="nme"><span class="err" id="nme" role="alert"></span></label>
    <div class="row"><label class="fld" style="flex:0 0 6rem"><span>Menge</span><input id="fq" type="text" inputmode="numeric" pattern="[0-9]*" value="1" autocomplete="off" aria-describedby="fqe"></label>
    <label class="fld" style="flex:1;min-width:0"><span>Preis pro Stück</span>${moneyIn('amt','','z. B. 2,80')}</label></div>
    <span class="err" id="fqe" role="alert" style="margin:-8px 0 8px"></span><span class="err" id="amte" role="alert" style="margin:-8px 0 8px"></span>
    <div class="fld" style="margin-bottom:0"><span>Kategorie</span><div class="chips" style="margin-top:0" role="radiogroup" aria-label="Kategorie" id="cats">${catChips()}</div></div>
    <button class="btn wide" id="addbtn" onclick="add()">Eintragen</button>
    <span class="muted small" style="display:block;margin-top:8px">Menge × Preis pro Stück. Neue Ausgaben werden oben gespeichert. Die Menge gilt auch für einen Tipp auf eine gespeicherte Ausgabe.</span>
    <button class="link c" onclick="closeM()">Abbrechen</button>`);
}
const catChips=()=>CATS.map(c=>`<button class="chip${c===fCat?' sel':''}" role="radio" aria-checked="${c===fCat}" onclick="fCat='${c}';$('#cats').innerHTML=catChips()">${ic(CAT[c].i,16)} ${c}</button>`).join('');
function add(){
  if(!once('add'))return;
  const raw=$('#nm').value.trim(),q=qtyOk($('#fq').value),r=parseMoney($('#amt').value);
  const okN=showErr('nm',raw?'':'Bitte gib einen Namen ein, z. B. Kaffee.');
  const okA=showErr('amt',moneyErr(r,10000,'einen Preis'));
  const okQ=showErr('fq',q?'':'Menge bitte als ganze Zahl zwischen 1 und 99.');
  if(!okA&&okN)$('#amt').focus();if(!okQ&&okN&&okA)$('#fq').focus();if(!okN)$('#nm').focus();
  if(!(okN&&okA&&okQ))return;
  const v=r.v;if(v*q>10000){showErr('amt','Menge × Preis ist ungewöhnlich hoch. Bitte prüfe die Eingabe.');return}
  const x=S.items.find(y=>y.n.toLowerCase()===raw.toLowerCase()&&y.p===v);
  if(!x)S.items.push({n:raw,p:v,c:fCat});
  closeM();spend(raw,v,q,fCat);toast(`${raw} eingetragen`);
}
/* Einrichtung in kleinen Schritten: Einkommen → Fixkosten → Sparziel */
const STEPS=[
  {t:'Wie viel bekommst du im Monat?',f:[['income','Einkommen pro Monat','z. B. 900,00','Gehalt, Bafög, Taschengeld – was regelmäßig reinkommt.',1e6]]},
  {t:'Was geht jeden Monat fest weg?',f:[['fixed','Fixkosten pro Monat','z. B. 450,00','Miete, Handy, Abos, Versicherungen.',1e6]]},
  {t:'Wie viel möchtest du sparen?',f:[['save','Sparziel pro Monat','z. B. 100,00','Wird vorab abgezogen und nicht verplant.',1e6],['goal','Sparkonto-Ziel','z. B. 300,00','Dein Ziel fürs Sparkonto, z. B. ein Notgroschen.',1e7],['min','Warnen, wenn pro Tag weniger übrig ist als','z. B. 1,00','',1e4]]}];
let step=0;
function settings(s=0){
  step=s;const st=STEPS[step];
  modal(`<div class="steps" aria-hidden="true">${STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
    <span class="muted small">Schritt ${step+1} von ${STEPS.length}</span><h3 style="margin-top:4px">${st.t}</h3>
    ${st.f.map(([k,l,ph,h])=>`<label class="fld"><span>${l}</span>${moneyIn('f_'+k,fmt2(S[k]),ph)}${h?`<span class="hint">${h}</span>`:''}<span class="err" id="f_${k}e" role="alert"></span></label>`).join('')}
    <div id="setres" class="muted">${setRes()}</div>
    <button class="btn wide" onclick="stepNext()">${step<STEPS.length-1?'Weiter':'Fertig'}</button>
    ${step?'<button class="btn soft wide" onclick="stepBack()">Zurück</button>':`<button class="link c" onclick="closeM()">${S.setupDone?'Abbrechen':'Später'}</button>`}`);
}
const setRes=()=>`Dein Wochenbudget: <b>${eur(wbase())}</b> · pro Tag ${eur(base())}`;
function stepRead(){
  let ok=true;
  for(const [k,,,,max] of STEPS[step].f){const r=parseMoney($('#f_'+k).value);let e='';
    if(r.e==='empty')e='Bitte gib einen Betrag ein. 0,00 ist auch möglich.';else if(r.e==='nan')e='Das ist keine gültige Zahl. Beispiel: 900,00';else if(r.v>max)e=`Das ist ungewöhnlich hoch. Bitte höchstens ${eur(max)}.`;else if(k==='goal'&&r.v<=0)e='Das Sparkonto-Ziel muss größer als 0,00 € sein.';
    if(!showErr('f_'+k,e))ok=false;else S[k]=r.v}
  return ok;
}
function stepNext(){if(!once('step'))return;if(!stepRead())return;render(true);if(step<STEPS.length-1)settings(step+1);else{S.setupDone=true;closeM();render(true);toast(`Fertig! Dein Wochenbudget: ${eur(wbase())}`)}}
function stepBack(){stepRead();render(true);settings(step-1)}
function depForm(){
  modal(`<h3>Auf Sparkonto einzahlen</h3>
    <label class="fld"><span>Betrag</span>${moneyIn('dep','','z. B. 20,00')}<span class="err" id="depe" role="alert"></span></label>
    <button class="btn wide" onclick="deposit()">Einzahlen</button><button class="link c" onclick="closeM()">Abbrechen</button>`);
}
function deposit(){
  if(!once('dep'))return;
  const r=parseMoney($('#dep').value);if(!showErr('dep',moneyErr(r,100000,'einen Betrag')))return;
  S.saved=r2(S.saved+r.v);S.dep.push({ts:Date.now(),n:'Einzahlung',a:r.v});closeM();render(true);toast(`${eur(r.v)} eingezahlt`);
}
function modal(h){$('#sheet').innerHTML=h;$('#modal').hidden=false;$('#sheet').scrollTop=0;vvFit();const f=$('#sheet input,#sheet button');if(f&&matchMedia('(pointer:fine)').matches)f.focus({preventScroll:true})}
function closeM(){$('#modal').hidden=true}
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}
/* Tastatur: Feld sichtbar halten (visualViewport) */
function vvFit(){const v=window.visualViewport,m=$('#modal');if(!v||!m)return;m.style.top=v.offsetTop+'px';m.style.height=v.height+'px';m.style.bottom='auto'}
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{vvFit();const a=document.activeElement;if(a&&a.tagName==='INPUT')a.scrollIntoView({block:'center'})});visualViewport.addEventListener('scroll',vvFit)}
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});
function ask(){
  if(!(S.pending>0))return;
  modal(`<h3>Letzte Woche blieben ${eur(S.pending)} übrig</h3><p class="muted">Rest aufs Sparkonto oder in die nächste Woche?</p>
    <button class="btn wide" onclick="answer('carry')">${ic('arrow',18)} In die neue Woche übertragen</button>
    <button class="btn soft wide" onclick="answer('save')">${mi(1,26)} Aufs Sparkonto legen</button>`);
}
function showMedal(){const m=MED[S.medalQ];S.medalQ=null;if(!m)return false;save();setTimeout(()=>medal(m),300);return true}
function onOpen(){if(S.pending>0)ask();else showMedal()}
function answer(c){
  if(!once('answer')||!(S.pending>0))return;
  const a=S.pending,w=S.weeks.filter(x=>x.r===null).pop();S.pending=0;
  if(c==='save'){S.saved=r2(S.saved+a);S.dep.push({ts:Date.now(),n:'Rest Woche '+(w?w.kw:kw(atDay(S.wkTs,-7))),a})}else S.carry=r2(S.carry+a);
  if(w)w.r=c;
  closeM();render(true);
  if(!showMedal()&&c==='save'&&!S.paySeen){S.paySeen=true;setTimeout(pay,300)}
}
function rollover(silent){
  if(S.pending>0){S.carry=r2(S.carry+S.pending);S.pending=0;S.weeks.forEach(x=>{if(x.r===null)x.r='carry'})}
  const gap=Math.max(1,Math.round((weekStart()-S.wkTs)/(7*D))),l=left();let m=-1;
  S.weeks.push({ts:S.wkTs,kw:kw(S.wkTs),b:r2(budget()),s:spentW(),r:l>0?null:l<0?'minus':'zero'});S.weeks=S.weeks.slice(-12);
  if(gap>2||l<0)S.streak=0;
  else{S.streak++;S.best=Math.max(S.best,S.streak);m=MED.findIndex(x=>x[0]===S.streak)}
  S.medalQ=m>=0?m:S.medalQ;S.pending=l>0?l:0;S.carry=l<0?l:0;
  S.wkN++;S.wkTs=weekStart();const old=Date.now()-120*D;S.ex=S.ex.filter(x=>x.ts>old);
  closeM();render(true);
  if(!silent)push(`Neue Woche! Dein Wochenbudget: ${eur(budget())}`+(S.pending>0?`. Letzte Woche blieben ${eur(S.pending)} übrig.`:l<0?`. Das Minus der letzten Woche (${eur(l)}) wurde abgezogen.`:''));
}
let pushT;
function push(t){const e=$('#push');$('#pushtxt').textContent=t;e.hidden=false;clearTimeout(pushT);pushT=setTimeout(()=>e.hidden=true,9000)}
function openPush(){$('#push').hidden=true;onOpen()}
function tick(){if(S.wkTs!==weekStart())rollover();const t=cdText();document.querySelectorAll('.cd').forEach(e=>e.textContent=t)}
setInterval(tick,1000);
function medal(m){modal(`<div style="text-align:center">${mi(MED.indexOf(m),110)}</div><h3 style="justify-content:center">Neue Medaille: ${m[1]}</h3><p class="muted">${wk(m[0])} in Folge im Budget geblieben. Weiter so!</p><button class="btn wide" onclick="closeM()">Super</button>`)}
function demo(){S.streak=7;S.best=Math.max(S.best,7);render(true);toast('Streak steht auf 7 Wochen. Simuliere den Wochenwechsel für die nächste Medaille.')}
function demoData(){
  const W=S.wkTs,w1=atDay(W,-14),w2=atDay(W,-7),now=Date.now(),td=atDay(now),ti=(new Date().getDay()+6)%7,h=(t,hh,mm=0)=>t+hh*36e5+mm*6e4;
  const e=(n,p,q,c,ts,w)=>({n,p,q,c,ts,w});
  S.ex=[e('Wocheneinkauf',38.5,1,'Einkauf',h(w1,17,20),S.wkN-2),e('Mensa',5.5,3,'Essen',h(atDay(w1,2),12,30),S.wkN-2),e('Kaffee',2.8,2,'Getränke',h(atDay(w1,3),9),S.wkN-2),
    e('Wocheneinkauf',41.2,1,'Einkauf',h(atDay(w2,1),18),S.wkN-1),e('Mensa',5.5,3,'Essen',h(atDay(w2,3),12,15),S.wkN-1),e('Kino',11,1,'Sonstiges',h(atDay(w2,5),20),S.wkN-1),e('Cola Zero',1,3,'Getränke',h(atDay(w2,4),15),S.wkN-1),
    e('Wocheneinkauf',29.4,1,'Einkauf',h(atDay(W,Math.min(1,ti)),18,20),S.wkN),e('Kaffee',2.8,1,'Getränke',h(td,9,10),S.wkN),e('Cola Zero',1,1,'Getränke',Math.min(now,h(td,10,30)),S.wkN)];
  S.weeks=[{ts:w1,kw:kw(w1),b:81.69,s:61.69,r:'save'},{ts:w2,kw:kw(w2),b:81.69,s:74.19,r:'carry'}];
  S.dep=[{ts:h(monthStart(),9),n:'Sparziel '+monthName(),a:100},{ts:h(w2,8),n:'Rest Woche '+kw(w1),a:20}];
  S.saved=120;S.streak=2;S.best=Math.max(S.best,2);S.carry=7.5;S.pending=0;render(true);toast('Demo-Daten geladen');
}
function pay(){
  modal(`<h3>${S.saved>0?'Du hast '+eur(S.saved)+' gespart':'My Weekly Budget Premium'}</h3>
    <p class="muted">Mehrere Sparziele, Statistik nach Kategorien und unregelmäßiges Einkommen.</p>
    <div class="plans">
      <button class="plan ${S.plan==='y'?'sel':''}" onclick="pick('y')"><em class="pop">Beliebt</em><b>Jahr</b><span>14,99 €</span><small>etwa 1,25 € pro Monat</small></button>
      <button class="plan ${S.plan==='m'?'sel':''}" onclick="pick('m')"><b>Monat</b><span>2,99 €</span><small>jederzeit kündbar</small></button></div>
    <button class="btn wide" onclick="buy()">10 Tage gratis testen</button>
    <div class="muted fine">Danach ${S.plan==='y'?'14,99 €/Jahr':'2,99 €/Monat'}, jederzeit kündbar</div>
    <button class="link" onclick="closeM()">Nicht jetzt</button>`);
}
function pick(p){S.plan=p;save();pay()}
function buy(){if(!once('buy'))return;closeM();toast('Nur ein Prototyp: Hier startet später der Kauf.')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* Wischen: Panels und blaue Tab-Markierung folgen dem Finger und gleiten danach weich ein */
const TABS=3,wrap=$('#wrap'),track=$('#track'),ind=$('#ind');
let idx=0,drag=null,quiet=false,wt,sliding=false;
const EASE='cubic-bezier(.22,.8,.24,1)';
const reduce=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
/* f = Position in Tabs (z. B. 0.4 = zwischen Übersicht und Mein Monat) */
const place=f=>{track.style.transform=`translate3d(${-f*100/TABS}%,0,0)`;ind.style.transform=`translate3d(calc(${f} * (100% + 4px)),0,0)`};
const pos=x=>place(idx-(x||0)/(wrap.offsetWidth||1));
const anim=ms=>{const t=reduce()?'none':`transform ${ms}ms ${EASE}`;track.style.transition=t;ind.style.transition=t};
const navUpd=()=>{document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('on',i===idx);b.setAttribute('aria-current',i===idx?'page':'false')});$('#fab').hidden=idx!==0;document.body.classList.toggle('fabon',idx===0);$('#fabbtn').innerHTML=ic('plus',18)+' Ausgabe eintragen'};
const ph=i=>{const p=$('#p'+i);return p?p.offsetHeight:0};
/* Während des Gleitens nie abschneiden: Höhe erst danach an die neue Seite anpassen */
const fit=()=>{if(sliding||drag&&drag.lock)return;wrap.style.height=ph(idx)+'px'};
function setTab(n,ms=380){
  n=Math.max(0,Math.min(TABS-1,n));const from=idx,ch=n!==from;
  if(ch){OPEN.forEach((id,t)=>{if(id)setOpen(id,false)});OPEN.fill(null)}
  idx=n;navUpd();
  wrap.style.transition='none';wrap.style.height=Math.max(ph(from),ph(n),wrap.offsetHeight||0)+'px';
  sliding=true;void track.offsetWidth;anim(ms);place(n);
  clearTimeout(wt);wt=setTimeout(()=>{sliding=false;
    const h=ph(idx);if(!reduce()&&h<wrap.offsetHeight-1){wrap.style.transition=`height 260ms ${EASE}`}
    wrap.style.height=h+'px';setTimeout(()=>{wrap.style.transition='none'},280)},reduce()?0:ms+20);
  if(ch&&window.scrollY>0)window.scrollTo({top:0,behavior:reduce()?'auto':'smooth'});
}
wrap.addEventListener('pointerdown',e=>{if(!$('#modal').hidden||e.target.closest('input')||sliding)return;drag={x:e.clientX,y:e.clientY,lock:0,d:0,lx:e.clientX,lt:performance.now(),v:0}});
wrap.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.lock){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){drag.lock=1;try{wrap.setPointerCapture(e.pointerId)}catch(_){}anim(0);track.style.transition=ind.style.transition='none';
      const nb=idx+(dx<0?1:-1);wrap.style.transition='none';wrap.style.height=Math.max(ph(idx),nb>=0&&nb<TABS?ph(nb):0)+'px'}
    else if(Math.abs(dy)>10){drag=null;return}
  }
  if(drag.lock){
    const now=performance.now(),dt=now-drag.lt;if(dt>0){drag.v=.8*((e.clientX-drag.lx)/dt)+.2*drag.v;drag.lx=e.clientX;drag.lt=now}
    const edge=(idx===0&&dx>0)||(idx===TABS-1&&dx<0);drag.d=edge?dx*.3:dx;pos(drag.d)}
});
const end=()=>{
  if(!drag)return;const d=drag;drag=null;if(!d.lock)return;
  quiet=true;setTimeout(()=>quiet=false,80);
  const w=wrap.offsetWidth||1,fl=Math.abs(d.v)>.35,dir=fl?(d.v<0?1:-1):(d.d<0?1:-1);
  const go=Math.abs(d.d)>w*.33||(fl&&Math.sign(-d.v)===Math.sign(-d.d)&&Math.abs(d.d)>16);
  const n=Math.max(0,Math.min(TABS-1,idx+(go?dir:0)));
  /* Restweg mit Fingertempo: schneller Wisch = kurzes Gleiten */
  const rest=Math.abs((n-idx)*w+d.d),ms=Math.round(Math.min(380,Math.max(200,fl?rest/Math.abs(d.v)*1.6:rest/w*380+120)));
  setTab(n,ms);
};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
document.addEventListener('click',e=>{if(quiet){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')closeM();return}if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowRight')setTab(idx+1);if(e.key==='ArrowLeft')setTab(idx-1)});
document.querySelectorAll('.panel').forEach(p=>new ResizeObserver(fit).observe(p));
window.addEventListener('resize',()=>{anim(0);place(idx)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.pending>0&&$('#modal').hidden)ask()}});
render(true);place(0);fit();
if(S.wkTs!==weekStart())rollover(true);
if(!S.setupDone)settings(0);else if(S.pending>0)ask();else showMedal();
</script>

<!doctype html><html><head><meta charset=utf-8><title>Sparfuchs</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
:root{color-scheme:light;--bg:#F5F5F7;--ink:#1D1D1F;--muted:#6E6E73;--acc:#8D99AE;--accink:#1D1D1F;--ok:#1f9d55;--sd:rgba(170,170,170,.5);--sl:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1D1D1F;--ink:#F5F5F7;--muted:#AAAAAA;--acc:#8D99AE;--accink:#1D1D1F;--ok:#34c47a;--sd:#111113;--sl:#2c2c31}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1D1D1F;--ink:#F5F5F7;--muted:#AAAAAA;--acc:#8D99AE;--accink:#1D1D1F;--ok:#34c47a;--sd:#111113;--sl:#2c2c31}
:root{--top:0px;--raise:7px 7px 18px var(--sd),-7px -7px 18px var(--sl);--raise-s:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);--inset:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
@media (pointer:coarse){:root{--top:calc(env(safe-area-inset-top,0px) + 12px)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.4;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;padding:var(--top) 0 48px;min-height:100vh;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 10px}
header b{font-size:1.2rem;letter-spacing:-.01em}
.day{font-size:.82rem;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:99px;box-shadow:var(--raise-s)}
#wrap{overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#track{display:flex;width:300%;align-items:flex-start;will-change:transform}
.panel{flex:0 0 33.3333%;min-width:0;padding:8px 24px 28px}
.hero{color:#fff;border-radius:30px;padding:22px 20px 18px;margin-bottom:24px;background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),linear-gradient(150deg,#8D99AE -30%,#23253A 100%);box-shadow:0 18px 36px rgba(35,37,58,.35)}
.hero small{font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.big{font-size:clamp(2.2rem,11.5vw,3.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 16px;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.hbar{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.hbar.low i{background:#ff8a7a}
.pills{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#1D1D1F;font-size:.82rem;font-weight:600;border-radius:99px;padding:8px 13px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.dot.a{background:#8D99AE}.dot.b{background:#23253A}
.card{background:var(--bg);border-radius:26px;padding:18px;margin-bottom:24px;box-shadow:var(--raise)}
h3{margin:0 0 12px;font-size:1.02rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.muted{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:16px;padding:13px 14px;box-shadow:var(--inset);user-select:text;-webkit-user-select:text}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:13px 18px;cursor:pointer;white-space:nowrap;box-shadow:0 8px 18px rgba(35,37,58,.28)}
.btn.soft{background:var(--bg);color:var(--ink);box-shadow:var(--raise-s)}
.wide{width:100%;margin-top:12px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--bg);border:0;border-radius:99px;padding:8px 14px;cursor:pointer;box-shadow:var(--raise-s)}
*{-webkit-tap-highlight-color:transparent}
button,input,label{touch-action:manipulation}
.chip,.btn,.lock,.plan,nav button{transition:transform .08s,background .25s,color .25s}
.chip:active,.btn:active,.lock:active,.plan:active,nav button:active{transform:scale(.96)}
.bar{height:12px;border-radius:99px;background:var(--bg);box-shadow:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.goal .bar i{background:var(--ok)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;margin-top:10px;font-size:.85rem}
.link{display:block;margin:12px auto 0;font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:underline;background:none;border:0;cursor:pointer;padding:0}
.log{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin-top:14px}
.m{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 2px 8px;border-radius:18px;box-shadow:var(--inset);opacity:.6}
.m .e{display:block;line-height:0;filter:grayscale(1)}
.ic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.mi{vertical-align:-5px}
.m b{font-size:.68rem;overflow-wrap:anywhere;hyphens:auto}
.m small{font-size:.65rem;color:var(--muted)}
.m.on{box-shadow:var(--raise-s);opacity:1}
.m.on .e{filter:none}
.lock{gap:12px;text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:20px;padding:15px 16px;margin-bottom:16px;cursor:pointer;box-shadow:var(--raise-s)}
.res{border-radius:22px;padding:14px 16px;color:#fff;background:linear-gradient(150deg,#8D99AE -30%,#23253A 100%)}
.res b{font-size:1.4rem}
.fine{text-align:center;margin-top:8px;font-size:.78rem}
.cdv{font-size:clamp(1.8rem,9vw,2.4rem);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
#push{position:fixed;left:16px;right:16px;top:calc(10px + var(--top));max-width:398px;margin:0 auto;z-index:40;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:22px;padding:12px 16px;cursor:pointer;box-shadow:var(--raise)}
#push[hidden]{display:none}
#push small{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.04em}
.warnbox{padding:12px 14px;border-radius:16px;font-size:.88rem;box-shadow:var(--inset),0 0 0 2px #ff9f0a}
label{display:block;margin-bottom:14px;font-size:.9rem;font-weight:600}
label input{margin-top:6px;font-weight:400}
nav{position:sticky;top:calc(6px + var(--top));margin:0 24px 12px;padding:6px;display:flex;gap:4px;border-radius:99px;background:var(--bg);box-shadow:var(--raise);z-index:10}
nav button{flex:1;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:99px;padding:11px 4px;cursor:pointer;transition:background .25s,color .25s}
nav button.on{background:var(--acc);color:var(--accink);box-shadow:0 6px 14px rgba(35,37,58,.28)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:430px;border-radius:32px 32px 0 0;padding:24px 20px calc(60px + env(safe-area-inset-bottom,0px))}
.plans{display:flex;gap:12px;margin:16px 0 6px}
.plan{flex:1;font:inherit;color:var(--ink);text-align:left;background:var(--bg);border:0;border-radius:20px;padding:14px;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--raise-s)}
.plan.sel{box-shadow:var(--inset),0 0 0 2px var(--acc)}
.plan span{font-size:1.2rem;font-weight:800}
.plan small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 16px;font-size:.85rem;z-index:30;max-width:90%}
@media (prefers-reduced-motion:reduce){#wrap,#track,.hbar i,.bar i{transition:none!important}}
</style>

`<rect x="-34" y="40" width="14" height="7" rx="2" fill="#5E6A80"/><rect x="20" y="40" width="14" height="7" rx="2" fill="#5E6A80"/><rect x="-46" y="-24" width="6" height="12" rx="2" fill="#5E6A80"/><rect x="-46" y="12" width="6" height="12" rx="2" fill="#5E6A80"/><rect x="-42" y="-42" width="84" height="84" rx="9" fill="#8D99AE" stroke="#5E6A80" stroke-width="2"/><rect x="-33" y="-33" width="66" height="66" rx="6" fill="#A9B3C6" stroke="#5E6A80" stroke-width="1.5"/><circle cx="-26" cy="-26" r="2.5" fill="#5E6A80"/><circle cx="26" cy="-26" r="2.5" fill="#5E6A80"/><circle cx="-26" cy="26" r="2.5" fill="#5E6A80"/><circle cx="26" cy="26" r="2.5" fill="#5E6A80"/><rect x="-15" y="-29" width="30" height="7" rx="3.5" fill="#E7B84B"/><circle cx="-4" cy="2" r="19" fill="#F5F5F7" stroke="#23253A" stroke-width="2.5"/><circle cx="-4" cy="2" r="14" fill="none" stroke="#23253A" stroke-width="4" stroke-dasharray="1.5 9.5"/><path d="M-4 2V-10" stroke="#23253A" stroke-width="3" stroke-linecap="round"/><circle cx="-4" cy="2" r="3.5" fill="#E7B84B" stroke="#23253A" stroke-width="1.5"/><rect x="20" y="-12" width="7" height="28" rx="3.5" fill="#23253A"/>`];
const mi=(i,s=28)=>`<svg class="mi" viewBox="-62 -68 124 128" width="${s}" height="${s}" aria-hidden="true">${MI[i]}</svg>`;
const ICP={flame:'M22 4C28 14 34 18 32 28C31 36 24 40 20 40C14 40 10 35 11 29C12 24 16 22 16 16C19 18 20 20 20 22C23 18 24 10 22 4Z',lock:'M8 20H36V38H8ZM13 20V14A9 9 0 0 1 31 14V20',plus:'M22 8V36M8 22H36',chart:'M8 38V26M18 38V12M28 38V22M40 38H6',warn:'M22 6L40 38H4ZM22 18V27M22 32V32.5',arrow:'M6 22H36M26 12L36 22L26 32',x:'M10 10L34 34M34 10L10 34'};
const ic=(n,s=18)=>`<svg class="ic" viewBox="0 0 44 44" width="${s}" height="${s}" aria-hidden="true"><path d="${ICP[n]}"/></svg>`;
const S={income:900,fixed:450,save:100,spent:0,carry:0,saved:0,day:1,paySeen:false,plan:'y',log:[],edit:false,streak:0,best:0,min:1,items:[{n:'Cola Zero',p:1},{n:'Kaffee',p:2.8},{n:'Mensa',p:5.5}]};
const base=()=>Math.max(0,(S.income-S.fixed-S.save)/30);
const budget=()=>base()+S.carry;
const left=()=>(Math.round((budget()-S.spent)*100)/100)||0;

function streakCard(){
  const nx=MED.find(x=>x[0]>S.streak),pct=nx?Math.min(100,S.streak/nx[0]*100):100;
  const t=S.streak>=2?`${ic('flame',16)} ${S.streak} Tage in Folge`:S.streak===1?'Tag 1 – bleib dran':'Noch keine Streak';
  return `<section class="card"><h3><span>${t}</span><span class="muted">Rekord ${S.best}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta"><span class="muted">${nx?`Noch ${nx[0]-S.streak} Tage bis ${mi(MED.indexOf(nx),20)} ${nx[1]}`:'Alle Medaillen geschafft!'}</span><button class="link" style="margin:0" onclick="setTab(2)">Medaillen ›</button></div></section>`;
}
function heute(){
  const l=left(),b=Math.max(budget(),.01),p=Math.min(1,Math.max(0,l/b)),low=l<0||p<.3;
  return `<section class="hero"><small>Heute noch übrig</small>
    <div class="big">${eur(l)}</div>
    <div class="hbar ${low?'low':''}"><i style="width:${p*100}%"></i></div>
    <div class="pills"><span class="pill"><i class="dot a"></i>Ausgegeben ${eur(S.spent)}</span><span class="pill"><i class="dot b"></i>Budget ${eur(budget())}</span></div></section>
  ${S.pending>0?`<section class="card"><h3>Rest von gestern</h3><div class="muted">${eur(S.pending)} warten auf deine Entscheidung.</div><button class="btn wide" onclick="ask()">Jetzt entscheiden</button></section>`:''}
  ${warn('margin-bottom:24px')}
  ${streakCard()}
  <section class="card"><h3>Ausgabe eintragen</h3>
    <input id="nm" type="text" placeholder="Name, z. B. Cola Zero" aria-label="Name">
    <div class="row" style="margin-top:10px"><input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Menge" style="max-width:76px"><input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Preis €" aria-label="Preis pro Stück"></div>
    <button class="btn wide" onclick="add()">Eintragen</button>
    <div class="muted" style="margin-top:8px">Menge × Preis pro Stück. Ein Tipp auf eine gespeicherte Ausgabe nutzt die Menge oben.</div>
    <div class="meta" style="margin-top:14px"><span class="muted">Meine Ausgaben</span><button class="link" style="margin:0" onclick="S.edit=!S.edit;render()">${S.edit?'Fertig':'Bearbeiten'}</button></div>
    <div class="chips">${S.items.length?S.items.map((x,i)=>`<button class="chip" onclick="${S.edit?`del(${i})`:`use(${i})`}">${x.n} ${eur(x.p)}${S.edit?' '+ic('x',12):''}</button>`).join(''):'<span class="muted">Noch nichts gespeichert. Trage oben etwas mit Namen ein.</span>'}</div></section>
  <section class="card"><h3>Heute eingetragen</h3>${S.log.length?S.log.map((x,i)=>`<div class="log"><span>${x.q>1?x.q+'× ':''}${x.n}</span><span>${eur(x.p*x.q)} <button class="chip" style="padding:4px 10px" onclick="undo(${i})" aria-label="Entfernen">${ic('x',12)}</button></span></div>`).join(''):'<span class="muted">Noch keine Ausgabe heute.</span>'}</section>
  <section class="card" style="text-align:center"><span class="muted">Neuer Tag in</span><div class="cdv" id="cd">${cdText()}</div></section>`;
}
function setup(){
  const f=(k,t)=>`<label>${t}<input type="number" inputmode="decimal" value="${S[k]}" oninput="setv('${k}',this.value)"></label>`;
  return `<section class="card"><h3>Mein Monat</h3>
    ${f('income','Einkommen pro Monat (€)')}${f('fixed','Fixkosten: Miete, Handy, Abos (€)')}${f('save','Sparziel pro Monat (€)')}${f('min','Streak zählt ab einem Rest von (€)')}
    <div class="res">Dein Tagesbudget: <b id="res"></b><br><small id="wk"></small></div><div id="wb" style="margin-top:14px"></div></section>
  <button class="lock" onclick="pay()"><span>Schwankt dein Einkommen? Unregelmäßiges Einkommen gibt es mit Premium.</span>${ic('lock')}</button>
  <div class="chips" style="margin-top:0"><button class="chip" onclick="demo()">Demo: Streak auf Tag 9 setzen</button><button class="chip" onclick="rollover()">Demo: Mitternacht simulieren</button></div>`;
}
function sparen(){
  const goal=200,p=Math.min(1,S.saved/goal),got=MED.filter(m=>S.best>=m[0]).length;
  return `<section class="card"><span class="muted">Sparkonto</span><div class="cdv">${eur(S.saved)}</div></section>
  <section class="card goal"><h3>Notgroschen</h3><div class="bar"><i style="width:${p*100}%"></i></div>
    <div class="meta"><span>${eur(S.saved)}</span><span class="muted">Ziel: ${eur(goal)}</span></div></section>
  <section class="card"><h3><span>Medaillen</span><span class="muted">${got} von ${MED.length}</span></h3>
    <div class="mgrid">${MED.map(m=>{const on=S.best>=m[0];return `<div class="m ${on?'on':''}"><span class="e">${mi(MED.indexOf(m),46)}</span><b>${m[1]}</b><small>Tag ${m[0]}</small></div>`}).join('')}</div>
    <div class="muted" style="margin-top:12px">Jede Marke zählt Tage in Folge, an denen etwas übrig bleibt.</div></section>
  <button class="lock" onclick="pay()"><span>${ic('plus')} Weitere Sparziele</span><span>${ic('lock')} Premium</span></button>
  <button class="lock" onclick="pay()"><span>${ic('chart')} Statistik nach Kategorien</span><span>${ic('lock')} Premium</span></button>`;
}
function render(all){
  $('#day').textContent='Tag '+S.day;
  [heute,setup,sparen].forEach((f,i)=>{if(all||i===idx)$('#p'+i).innerHTML=f()});
  calc();navUpd();
}
function calc(){save();$('#res').textContent=eur(base());$('#wk').textContent='Pro Woche: '+eur(base()*7);$('#wb').innerHTML=warn()}
function warn(st=''){return S.fixed+S.save>S.income?`<div class="warnbox" role="alert" style="${st}">${ic('warn',18)} Fixkosten und Sparziel (${eur(S.fixed+S.save)}) liegen über deinem Einkommen. Dein Tagesbudget ist 0 €.</div>`:''}
function setv(k,v){S[k]=parseFloat(v)||0;calc()}
function spend(n,p,q=1){S.spent+=p*q;S.log.push({n,p,q});render()}
function use(i){const x=S.items[i],q=Math.max(1,parseInt($('#qty').value)||1);spend(x.n,x.p,q)}
function del(i){S.items.splice(i,1);render()}
function undo(i){const x=S.log.splice(i,1)[0];S.spent-=x.p*x.q;render()}
function add(){
  const v=parseFloat($('#amt').value.replace(',','.')),raw=$('#nm').value.trim(),n=raw||'Ausgabe',q=Math.max(1,parseInt($('#qty').value)||1);
  if(!(v>0))return;
  const x=S.items.find(y=>y.n.toLowerCase()===n.toLowerCase()&&y.p===v);
  if(!x&&raw)S.items.push({n,p:v});
  spend(n,v,q)
}
function modal(h){$('#sheet').innerHTML=h;$('#modal').hidden=false}
function closeM(){$('#modal').hidden=true}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}
function ask(){
  if(!(S.pending>0))return;
  modal(`<h3>Gestern blieben ${eur(S.pending)} übrig</h3><p class="muted">Was soll damit passieren?</p>
    <button class="btn wide" onclick="answer('carry')">${ic('arrow',18)} Auf heute übertragen</button>
    <button class="btn soft wide" onclick="answer('save')">${mi(1,26)} Aufs Sparkonto legen</button>`);
}
function showMedal(){const m=S.medalQ;if(!m)return false;S.medalQ=null;setTimeout(()=>medal(m),300);return true}
function onOpen(){if(S.pending>0)ask();else showMedal()}
function answer(c){
  const a=S.pending;S.pending=0;
  if(c==='save')S.saved+=a;else S.carry+=a;
  closeM();render();
  if(!showMedal()&&c==='save'&&!S.paySeen){S.paySeen=true;setTimeout(pay,300)}
}
const today=()=>new Date().toDateString();
const dayStart=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()};
S.dayKey=today();S.dayTs=dayStart();S.pending=0;S.medalQ=null;
/* App: Stand lokal speichern, damit nichts beim Schließen verloren geht */
try{Object.assign(S,JSON.parse(localStorage.getItem('dc')||'{}'))}catch(_){}
const save=()=>{try{localStorage.setItem('dc',JSON.stringify(S))}catch(_){}};
function rollover(){
  if(S.pending>0){S.carry+=S.pending;S.pending=0}
  const gap=Math.max(1,Math.round((dayStart()-S.dayTs)/864e5)),l=left(),ok=l>=S.min;let m=null;
  if(gap>1)S.streak=0;
  else if(ok){S.streak++;S.best=Math.max(S.best,S.streak);m=MED.find(x=>x[0]===S.streak)}else S.streak=0;
  S.medalQ=m||null;S.pending=l>0?l:0;S.carry=l<0?l:0;
  S.spent=0;S.log=[];S.day++;S.dayKey=today();S.dayTs=dayStart();closeM();render(true);
  push(`Neuer Tag! Dein Budget heute: ${eur(budget())}`+(S.pending>0?`. Gestern blieben ${eur(S.pending)} übrig.`:l<0?`. Das Minus von gestern (${eur(l)}) wurde abgezogen.`:''));
}
let pushT;
function push(t){const e=$('#push');$('#pushtxt').textContent=t;e.hidden=false;clearTimeout(pushT);pushT=setTimeout(()=>e.hidden=true,9000)}
function openPush(){$('#push').hidden=true;onOpen()}
function cdText(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((m-n)/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}
function tick(){if(S.dayKey!==today())rollover();const e=$('#cd');if(e)e.textContent=cdText()}
setInterval(tick,1000);
function medal(m){modal(`<div style="text-align:center">${mi(MED.indexOf(m),110)}</div><h3 style="justify-content:center">Neue Medaille: ${m[1]}</h3><p class="muted">${m[0]} Tage in Folge ist etwas übrig geblieben. Weiter so!</p><button class="btn wide" onclick="closeM()">Super</button>`)}
function demo(){S.streak=9;S.best=Math.max(S.best,9);render();toast('Streak steht auf 9. Simuliere Mitternacht, um die nächste Medaille zu bekommen.')}
function pay(){
  modal(`<h3>${S.saved>0?'Du hast '+eur(S.saved)+' gespart':'Sparfuchs Premium'}</h3>
    <p class="muted">Mehrere Sparziele, Statistik nach Kategorien und unregelmäßiges Einkommen.</p>
    <div class="plans">
      <button class="plan ${S.plan==='y'?'sel':''}" onclick="pick('y')"><b>Jahr</b><span>14,99 €</span><small>etwa 1,25 € pro Monat</small></button>
      <button class="plan ${S.plan==='m'?'sel':''}" onclick="pick('m')"><b>Monat</b><span>2,99 €</span><small>jederzeit kündbar</small></button></div>
    <button class="btn wide" onclick="buy()">7 Tage gratis testen</button>
    <div class="muted fine">Danach ${S.plan==='y'?'14,99 €/Jahr':'2,99 €/Monat'}, jederzeit kündbar</div>
    <button class="link" onclick="closeM()">Nicht jetzt</button>`);
}
function pick(p){S.plan=p;save();pay()}
function buy(){closeM();toast('Nur ein Prototyp: Hier startet später der Kauf.')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* Wischen: Panels folgen dem Finger, danach gleitet die Ansicht ein */
const TABS=3,wrap=$('#wrap'),track=$('#track');
let idx=0,drag=null,quiet=false,wt;
const pos=x=>{track.style.transform=`translateX(calc(${-idx*100/TABS}% + ${x||0}px))`};
const navUpd=()=>document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('on',i===idx);b.setAttribute('aria-current',i===idx?'page':'false')});
const fit=()=>{wrap.style.height=$('#p'+idx).offsetHeight+'px'};
function setTab(n){
  n=Math.max(0,Math.min(TABS-1,n));const ch=n!==idx;idx=n;render(true);
  wrap.style.transition='height .42s cubic-bezier(.22,1,.36,1)';track.style.transition='transform .42s cubic-bezier(.22,1,.36,1)';pos(0);fit();
  clearTimeout(wt);wt=setTimeout(()=>{wrap.style.transition='none'},480);
  if(ch)window.scrollTo({top:0,behavior:'smooth'});
}
wrap.addEventListener('pointerdown',e=>{if(!$('#modal').hidden||e.target.closest('input'))return;drag={x:e.clientX,y:e.clientY,t:Date.now(),lock:0,d:0}});
wrap.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.lock){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){drag.lock=1;try{wrap.setPointerCapture(e.pointerId)}catch(_){}track.style.transition='none'}
    else if(Math.abs(dy)>10){drag=null;return}
  }
  if(drag.lock){const edge=(idx===0&&dx>0)||(idx===TABS-1&&dx<0);drag.d=edge?dx*.3:dx;pos(drag.d)}
});
const end=()=>{
  if(!drag)return;const d=drag;drag=null;if(!d.lock)return;
  quiet=true;setTimeout(()=>quiet=false,80);
  const w=wrap.offsetWidth,v=Math.abs(d.d)/(Date.now()-d.t+1),go=Math.abs(d.d)>24&&(Math.abs(d.d)>w*.22||v>.5);
  setTab(idx+(go?(d.d<0?1:-1):0));
};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
document.addEventListener('click',e=>{if(quiet){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')closeM();return}if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowRight')setTab(idx+1);if(e.key==='ArrowLeft')setTab(idx-1)});
document.querySelectorAll('.panel').forEach(p=>new ResizeObserver(fit).observe(p));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.pending>0&&$('#modal').hidden)ask()}});
setTab(0);
</script>

</body></html>

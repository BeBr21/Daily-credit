<!doctype html><html><head><meta charset=utf-8><title>My Weekly Budget</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
:root{color-scheme:light;--bg:#F3F3F5;--ink:#141414;--muted:#66666B;--acc:#1B2E52;--accink:#FFFFFF;--sd:rgba(170,170,175,.55);--sl:#FFFFFF;--beige:#D2B48C;--ok:#1f9d55;--okt:#187A43;--warn:#E8890C;--bad:#C62828;--c3:#5E6F94;--c4:#B9B9BF;--line:rgba(20,20,20,.38)}
:root{--top:0px;--raise:7px 7px 18px var(--sd),-7px -7px 18px var(--sl);--raise-s:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);--inset:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);--navy:radial-gradient(circle at 80% 12%,rgba(255,255,255,.2),transparent 55%),linear-gradient(150deg,#1B2E52 -30%,#121212 100%)}
@media (pointer:coarse){:root{--top:calc(env(safe-area-inset-top,0px) + 12px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.4;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;padding:var(--top) 0 48px;min-height:100vh;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 10px}
header b{font-size:1.2rem;letter-spacing:-.01em}
.day{font-size:.82rem;font-weight:700;color:var(--ink);padding:6px 14px;border-radius:99px;box-shadow:var(--raise-s),inset 0 0 0 2px var(--beige)}
nav{position:sticky;top:calc(6px + var(--top));margin:0 24px 12px;padding:6px;display:flex;gap:4px;border-radius:99px;background:var(--bg);box-shadow:var(--raise);z-index:10}
nav button{flex:1;min-width:0;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:99px;padding:11px 4px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accink);box-shadow:0 6px 14px rgba(18,24,40,.3)}
#wrap{overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#track{display:flex;width:300%;align-items:flex-start;will-change:transform}
.panel{flex:0 0 33.3333%;min-width:0;padding:8px 24px 28px}
/* Hero mit Ring */
.hero{color:#fff;border-radius:30px;padding:20px;margin-bottom:24px;background:var(--navy);box-shadow:0 18px 36px rgba(18,24,40,.35)}
.hero>small{font-weight:600;font-size:.85rem;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;margin-top:10px}
.ring{--rs:clamp(130px,40vw,170px);width:var(--rs);height:var(--rs);flex:none;position:relative}
.ring svg{display:block;width:100%;height:100%}
.ring circle{transition:stroke-dasharray .4s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.ring .c b{font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring .c small{font-size:.74rem;opacity:.8;white-space:nowrap}
.hinfo{flex:1 1 108px;min-width:108px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hinfo .lbl{font-size:.78rem;font-weight:600;opacity:.85}
.hinfo .val{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:-6px}
.pct{background:#F3F3F5;border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:800;white-space:nowrap;box-shadow:3px 3px 8px rgba(0,0,0,.35),-2px -2px 6px rgba(255,255,255,.14)}
.pct.g{color:#187A43}.pct.o{color:#9A5200}.pct.r{color:#C62828}
.clock{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 11px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Karten */
.card{background:var(--bg);border-radius:26px;padding:18px;margin-bottom:24px;box-shadow:var(--raise)}
h3{margin:0 0 12px;font-size:1.02rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
h3 .muted{font-weight:600}
.muted{color:var(--muted);font-size:.85rem}
.big2{font-size:1.5rem;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.pos{color:var(--okt);font-weight:700}.neg{color:var(--bad);font-weight:700}
.row{display:flex;gap:10px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:16px;padding:13px 14px;box-shadow:var(--inset);user-select:text;-webkit-user-select:text}
input::placeholder{color:var(--muted);opacity:.85}
input:focus-visible,button:focus-visible{outline:3px solid var(--beige);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:13px 18px;cursor:pointer;white-space:nowrap;box-shadow:0 8px 18px rgba(18,24,40,.28)}
.btn.soft{background:var(--bg);color:var(--ink);box-shadow:var(--raise-s)}
.wide{width:100%;margin-top:12px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--bg);border:0;border-radius:99px;padding:8px 14px;cursor:pointer;box-shadow:var(--raise-s)}
.chip.sel{background:var(--acc);color:var(--accink)}
button,input,label{touch-action:manipulation}
.chip,.btn,.lock,.plan,nav button,.xh{transition:transform .08s,background .25s,color .25s}
.chip:active,.btn:active,.lock:active,.plan:active,nav button:active{transform:scale(.96)}
.bar{height:12px;border-radius:99px;background:var(--bg);box-shadow:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;margin-top:10px;font-size:.85rem}
.link{display:block;margin:12px auto 0;font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:underline;background:none;border:0;cursor:pointer;padding:0}
.ic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.mi{vertical-align:-5px;flex:none}
/* Streak + Medaillen */
.streak{display:flex;align-items:center;gap:14px}
.streak .t{flex:1;min-width:0}
.streak .t b{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin-top:4px}
.m{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 2px 8px;border-radius:18px;box-shadow:var(--inset);opacity:.6}
.m .e{display:block;line-height:0;filter:grayscale(1)}
.m b{font-size:.68rem;overflow-wrap:anywhere;hyphens:auto}
.m small{font-size:.65rem;color:var(--muted)}
.m.on{box-shadow:var(--raise-s);opacity:1}
.m.on .e{filter:none}
/* Aufklappbare Karten */
.xc{background:var(--bg);border-radius:26px;margin-bottom:24px;box-shadow:var(--raise)}
.xh{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:26px;padding:18px;cursor:pointer}
.xt{display:flex;align-items:center;gap:12px}
.xt .t{flex:1;min-width:0}
.xt .t b{display:block;font-size:1.02rem}
.xt .t small{display:block;color:var(--muted);font-size:.82rem}
.chev{transition:transform .2s ease;color:var(--muted)}
.xc.open .chev{transform:rotate(180deg)}
.xsum{display:block;margin-top:12px}
.xc.open .xsum{display:none}
.xb{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .2s ease,opacity .2s ease}
.xc.open .xb{grid-template-rows:1fr;opacity:1}
.xb>div{overflow:hidden;min-height:0}
.xin{padding:0 18px 18px}
.sl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.sl+.sl{margin-top:6px}
/* Einträge */
.ex{display:flex;align-items:center;gap:12px;padding:7px 0}
.ex .n{flex:1;min-width:0}
.ex .n b{display:block;font-size:.92rem;font-weight:600;overflow-wrap:anywhere}
.ex .n small{color:var(--muted);font-size:.76rem}
.ex .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:var(--raise-s)}
.rm{font:inherit;color:var(--muted);background:var(--bg);border:0;border-radius:99px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--raise-s);flex:none}
/* Wochenverlauf */
.wk{position:relative;height:120px;display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.wk .col{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end;height:100%}
.wk .b{width:100%;max-width:30px;border-radius:8px;background:var(--acc);transition:height .4s}
.wk .b.over{background:var(--warn)}
.wk .b.fut{background:none;border:2px dashed var(--c4)}
.wk .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--line);pointer-events:none}
.wkl{display:flex;gap:8px;margin-top:6px}
.wkl span{flex:1;min-width:0;text-align:center;font-size:.75rem;color:var(--muted)}
.wkl span.td{color:var(--ink);font-weight:800}
.mini{display:flex;gap:10px}
.mini>span{flex:1;min-width:0;display:block}
.mini small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.bar.s{height:8px}
.bar i.cur{background:var(--beige)}
.bar i.bad{background:var(--bad)}
.wrow+.wrow{margin-top:14px}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;box-shadow:var(--inset);background:var(--bg)}
.seg i{display:block;height:100%}
.leg{display:flex;align-items:center;gap:10px;font-size:.88rem;margin-top:8px}
.leg .d{width:12px;height:12px;border-radius:50%;flex:none}
.leg span:nth-child(2){flex:1;min-width:0}
.lock{gap:12px;text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:20px;padding:15px 16px;margin-bottom:16px;cursor:pointer;box-shadow:var(--raise-s)}
.fine{text-align:center;margin-top:8px;font-size:.78rem}
#push{position:fixed;left:16px;right:16px;top:calc(10px + var(--top));max-width:398px;margin:0 auto;z-index:40;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:22px;padding:12px 16px;cursor:pointer;box-shadow:var(--raise)}
#push[hidden]{display:none}
#push small{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.04em}
.warnbox{padding:12px 14px;border-radius:16px;font-size:.88rem;box-shadow:var(--inset),0 0 0 2px var(--warn)}
label{display:block;margin-bottom:14px;font-size:.9rem;font-weight:600}
label input{margin-top:6px;font-weight:400}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:32px 32px 0 0;padding:24px 20px calc(60px + env(safe-area-inset-bottom,0px))}
.plans{display:flex;gap:12px;margin:16px 0 6px}
.plan{flex:1;min-width:0;font:inherit;color:var(--ink);text-align:left;background:var(--bg);border:0;border-radius:20px;padding:14px;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--raise-s)}
.plan.sel{box-shadow:var(--inset),0 0 0 2px var(--acc)}
.plan span{font-size:1.2rem;font-weight:800}
.plan small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 16px;font-size:.85rem;z-index:30;max-width:90%}
@media (prefers-reduced-motion:reduce){#wrap,#track,.bar i,.xb,.chev,.wk .b,.ring circle{transition:none!important}}
</style>
<div class="app">
  <header><b>My Weekly Budget</b><span class="day" id="day"></span></header>
  <nav>

</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Hinweis"></div></div>

`<rect x="-34" y="40" width="14" height="7" rx="2" fill="#5E6A80"/><rect x="20" y="40" width="14" height="7" rx="2" fill="#5E6A80"/><rect x="-46" y="-24" width="6" height="12" rx="2" fill="#5E6A80"/><rect x="-46" y="12" width="6" height="12" rx="2" fill="#5E6A80"/><rect x="-42" y="-42" width="84" height="84" rx="9" fill="#8D99AE" stroke="#5E6A80" stroke-width="2"/><rect x="-33" y="-33" width="66" height="66" rx="6" fill="#A9B3C6" stroke="#5E6A80" stroke-width="1.5"/><circle cx="-26" cy="-26" r="2.5" fill="#5E6A80"/><circle cx="26" cy="-26" r="2.5" fill="#5E6A80"/><circle cx="-26" cy="26" r="2.5" fill="#5E6A80"/><circle cx="26" cy="26" r="2.5" fill="#5E6A80"/><rect x="-15" y="-29" width="30" height="7" rx="3.5" fill="#E7B84B"/><circle cx="-4" cy="2" r="19" fill="#F5F5F7" stroke="#23253A" stroke-width="2.5"/><circle cx="-4" cy="2" r="14" fill="none" stroke="#23253A" stroke-width="4" stroke-dasharray="1.5 9.5"/><path d="M-4 2V-10" stroke="#23253A" stroke-width="3" stroke-linecap="round"/><circle cx="-4" cy="2" r="3.5" fill="#E7B84B" stroke="#23253A" stroke-width="1.5"/><rect x="20" y="-12" width="7" height="28" rx="3.5" fill="#23253A"/>`];
const mi=(i,s=28)=>`<svg class="mi" viewBox="-62 -68 124 128" width="${s}" height="${s}" aria-hidden="true">${MI[i]}</svg>`;
const ICP={flame:'M22 4C28 14 34 18 32 28C31 36 24 40 20 40C14 40 10 35 11 29C12 24 16 22 16 16C19 18 20 20 20 22C23 18 24 10 22 4Z',lock:'M8 20H36V38H8ZM13 20V14A9 9 0 0 1 31 14V20',plus:'M22 8V36M8 22H36',chart:'M8 38V26M18 38V12M28 38V22M40 38H6',warn:'M22 6L40 38H4ZM22 18V27M22 32V32.5',arrow:'M6 22H36M26 12L36 22L26 32',x:'M10 10L34 34M34 10L10 34',chev:'M12 17L22 27L32 17',clock:'M22 6A16 16 0 1 0 22.01 6ZM22 13V22L28 26',food:'M13 6V17A4 4 0 0 0 21 17V6M17 6V38M31 38V6C27 8 26 16 26 23H31',bag:'M9 14H35L33 38H11ZM16 14V12A6 6 0 0 1 28 12V14',cup:'M11 13H33L30 38H14ZM11 19H33M24 13L27 5',tag:'M6 6H21L38 23L23 38L6 21ZM14 14V14.5'};
const ic=(n,s=18)=>`<svg class="ic${n==='chev'?' chev':''}" viewBox="0 0 44 44" width="${s}" height="${s}" aria-hidden="true"><path d="${ICP[n]}"/></svg>`;
const CAT={'Essen':{c:'var(--acc)',i:'food'},'Einkauf':{c:'var(--beige)',i:'bag'},'Getränke':{c:'var(--c3)',i:'cup'},'Sonstiges':{c:'var(--c4)',i:'tag'}};
const CATS=Object.keys(CAT);
/* Medaillen-Schwellen in Wochen: der Reihe nach, die letzte immer bei Woche 52 */
(()=>{const W=[1,2,4,8,12,16,20,26,52];MED.forEach((m,i)=>m[0]=i===MED.length-1?52:W[Math.min(i,W.length-2)])})();

/* ---------- Zeit ---------- */
const D=864e5,DN=['So','Mo','Di','Mi','Do','Fr','Sa'];
const atDay=(t,dd=0)=>{const n=new Date(t);return new Date(n.getFullYear(),n.getMonth(),n.getDate()+dd).getTime()};
const weekStart=(t=Date.now())=>atDay(t,-((new Date(t).getDay()+6)%7));
const monthStart=(t=Date.now())=>{const n=new Date(t);return new Date(n.getFullYear(),n.getMonth(),1).getTime()};
const mDays=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0).getDate()};
const kw=t=>{const d=new Date(atDay(t));d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/D-3+(w1.getDay()+6)%7)/7)};
const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const dm=t=>new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const monthName=()=>new Date().toLocaleDateString('de-DE',{month:'long'});
const wk=n=>n===1?'1 Woche':n+' Wochen';
const eur0=n=>n%1===0?n.toLocaleString('de-DE')+' €':eur(n);

/* ---------- Zustand ---------- */
const S={income:900,fixed:450,save:100,min:1,goal:300,saved:0,carry:0,pending:0,streak:0,best:0,plan:'y',paySeen:false,edit:false,wkN:1,wkTs:weekStart(),medalQ:null,
  items:[{n:'Cola Zero',p:1,c:'Getränke'},{n:'Kaffee',p:2.8,c:'Getränke'},{n:'Mensa',p:5.5,c:'Essen'}],ex:[],weeks:[],dep:[]};
(()=>{let L=null;try{L=JSON.parse(localStorage.getItem('dc3')||'null')}catch(_){}
  if(L){Object.assign(S,L);return}
  /* Spielstand der Vorversion übernehmen: Streak und Rekord gelten als Wochen */
  try{const o=JSON.parse(localStorage.getItem('dc')||'null');if(!o)return;
    ['income','fixed','save','min','saved','carry','pending','streak','best','plan','paySeen'].forEach(k=>{if(typeof o[k]===typeof S[k])S[k]=o[k]});
    if(Array.isArray(o.items))S.items=o.items.map(x=>({n:x.n,p:x.p,c:CAT[x.c]?x.c:'Sonstiges'}));
    if(Array.isArray(o.log)&&o.wkTs===S.wkTs)S.ex=o.log.map(x=>({n:x.n,p:x.p,q:x.q||1,c:'Sonstiges',ts:Date.now(),w:S.wkN}));
  }catch(_){}})();
const save=()=>{try{localStorage.setItem('dc3',JSON.stringify(S))}catch(_){}};

/* ---------- Rechnen ---------- */
const avail=()=>Math.max(0,S.income-S.fixed-S.save);
const base=()=>avail()/mDays();
const wbase=()=>base()*7;
const budget=()=>wbase()+S.carry;
const r2=n=>(Math.round(n*100)/100)||0;
const weekEx=()=>S.ex.filter(x=>x.w===S.wkN);
const sum=a=>a.reduce((s,x)=>s+x.p*x.q,0);
const spentW=()=>r2(sum(weekEx()));
const left=()=>r2(budget()-spentW());
const daysLeft=()=>{const d=new Date().getDay();return d===0?1:8-d};
const perDay=()=>Math.max(0,Math.floor(left()/daysLeft()*100)/100);
const pctOf=(a,b)=>b>0?Math.max(0,Math.round(a/b*100)):0;
const pcls=p=>p>=30?'g':p>=10?'o':'r';
const monthEx=()=>{const m=monthStart();return S.ex.filter(x=>x.ts>=m)};

/* ---------- Bausteine ---------- */
function ring(f,big,small){
  const C=2*Math.PI*62,g=Math.max(0,Math.min(1,f||0)),fs=Math.min(.15,1/Math.max(big.length,1)).toFixed(3);
  return `<div class="ring" role="img" aria-label="${big} ${small}"><svg viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="62" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="14"/>${g>0?`<circle cx="85" cy="85" r="62" fill="none" stroke="var(--beige)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*g).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 85 85)"/>`:''}</svg><div class="c" aria-hidden="true"><b style="font-size:calc(var(--rs) * ${fs})">${big}</b><small>${small}</small></div></div>`;
}
const hero=(label,rg,info)=>`<section class="hero"><small>${label}</small><div class="hrow">${rg}<div class="hinfo">${info}</div></div></section>`;
const OPEN=[null,null,null];
function xcard(id,title,sub,sm,body){
  const o=OPEN[+id[1]]===id;
  return `<section class="xc${o?' open':''}" id="${id}"><button class="xh" aria-expanded="${o}" aria-controls="${id}b" onclick="tog('${id}')"><span class="xt"><span class="t"><b>${title}</b><small>${sub}</small></span>${ic('chev',20)}</span><span class="xsum">${sm}</span></button><div class="xb" id="${id}b" role="region" aria-label="${title}"${o?'':' inert'}><div><div class="xin">${body}</div></div></div></section>`;
}
function setOpen(id,o){const c=document.getElementById(id);if(!c)return;c.classList.toggle('open',o);c.querySelector('.xh').setAttribute('aria-expanded',String(o));c.querySelector('.xb').inert=!o}
function tog(id){const t=+id[1],was=OPEN[t]===id;if(OPEN[t]&&!was)setOpen(OPEN[t],false);setOpen(id,!was);OPEN[t]=was?null:id}
const tile=c=>`<span class="tile" style="color:${CAT[c].c}">${ic(CAT[c].i,18)}</span>`;
function exRow(x,i,today){
  return `<div class="ex">${tile(x.c)}<span class="n"><b>${x.q>1?x.q+'× ':''}${x.n}</b><small>${today?hm(x.ts):DN[new Date(x.ts).getDay()]+' · '+hm(x.ts)} · ${x.c}</small></span><span class="a">−${eur(x.p*x.q)}</span>${i>=0?`<button class="rm" onclick="undo(${i})" aria-label="${x.n} entfernen">${ic('x',12)}</button>`:''}</div>`;
}
const cdText=()=>{const s=Math.max(0,Math.floor((atDay(weekStart(),7)-Date.now())/1000)),p=v=>String(v).padStart(2,'0');return `${Math.floor(s/86400)} T ${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}`};
const clock=()=>`<span class="clock">${ic('clock',14)}<span class="cd">${cdText()}</span></span>`;
function streakCard(){
  const nx=MED.find(x=>x[0]>S.streak),pct=nx?Math.min(100,S.streak/nx[0]*100):100,ni=nx?MED.indexOf(nx):MED.length-1;
  const t=S.streak?`${wk(S.streak)} Streak`:'Noch keine Streak';
  return `<section class="card"><div class="streak">${mi(ni,48)}<span class="t"><b>${t}</b><span class="muted">${nx?`Noch ${wk(nx[0]-S.streak)} bis ${nx[1]}`:'Alle Medaillen geschafft!'}</span></span></div>
    <div class="bar" style="margin-top:14px"><i style="width:${pct}%"></i></div>
    <div class="meta"><span class="muted">Rekord ${wk(S.best)}</span><button class="link" style="margin:0" onclick="setTab(2)">Medaillen ›</button></div></section>`;
}
function warn(st=''){
  if(S.fixed+S.save>S.income)return `<div class="warnbox" role="alert" style="${st}">${ic('warn',18)} Fixkosten und Sparziel (${eur(S.fixed+S.save)}) liegen über deinem Einkommen. Dein Wochenbudget ist 0 €.</div>`;
  const l=left();
  if(wbase()>0&&(l<=0||perDay()<S.min))return `<div class="warnbox" role="alert" style="${st}">${ic('warn',18)} ${l<0?`Du liegst diese Woche ${eur(-l)} über dem Budget.`:l===0?'Dein Wochenbudget ist aufgebraucht.':`Nur noch ${eur(perDay())} pro Tag bis Montag.`}</div>`;
  return '';
}

/* ---------- Übersicht ---------- */
function weekChart(){
  const now=new Date(),ti=(now.getDay()+6)%7,v=[0,0,0,0,0,0,0];
  weekEx().forEach(x=>{v[(new Date(x.ts).getDay()+6)%7]+=x.p*x.q});
  const tw=base(),mx=Math.max(...v,tw)*1.15||1,H=120,h=a=>Math.max(6,Math.round(a/mx*H));
  const cols=v.map((a,i)=>i>ti?`<span class="col"><i class="b fut" style="height:${h(tw)}px"></i></span>`:`<span class="col"><i class="b${a>tw&&tw>0?' over':''}" style="height:${h(a)}px" title="${eur(a)}"></i></span>`).join('');
  const sr=v.map((a,i)=>`${['Mo','Di','Mi','Do','Fr','Sa','So'][i]} ${i>ti?'–':eur(a)}`).join(', ');
  return `<div class="wk" role="img" aria-label="Ausgaben pro Tag: ${sr}">${cols}${tw>0?`<i class="ln" style="bottom:${h(tw)}px"></i>`:''}</div>
    <div class="wkl" aria-hidden="true">${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<span class="${i===ti?'td':''}">${d}</span>`).join('')}</div>
    <div class="muted" style="margin-top:8px">Gestrichelt: Tageswert ${eur(tw)}</div>`;
}
function uebersicht(){
  const l=left(),b=budget(),p=pctOf(l,b),we=weekEx(),td=atDay(Date.now());
  const today=we.filter(x=>x.ts>=td),ts=sum(today),last=today[today.length-1];
  const list=S.ex.map((x,i)=>[x,i]).filter(([x])=>x.w===S.wkN).reverse();
  return hero('Diese Woche noch übrig',ring(b>0?l/b:0,eur(l),'von '+eur(b)),
    `<span class="lbl">Pro Tag</span><span class="val">${eur(perDay())}</span><span class="pct ${pcls(p)}">${p} % frei</span>${clock()}`)
  +(S.pending>0?`<section class="card"><h3>Rest der letzten Woche</h3><div class="muted">${eur(S.pending)} warten auf deine Entscheidung.</div><button class="btn wide" onclick="ask()">Jetzt entscheiden</button></section>`:'')
  +warn('margin-bottom:24px')
  +`<section class="card"><h3><span>Wochenverlauf</span><span class="muted">${eur(spentW())} ausgegeben</span></h3>${weekChart()}</section>`
  +streakCard()
  +xcard('x0a','Heute',today.length?'Antippen für alle Einträge der Woche':'Antippen für Details',
    `<span class="sl"><b>${today.length===1?'1 Eintrag':today.length+' Einträge'} · ${eur(ts)}</b></span>${last?`<span class="sl muted" style="margin-top:6px"><span>Zuletzt: ${last.q>1?last.q+'× ':''}${last.n} · ${hm(last.ts)}</span><span>−${eur(last.p*last.q)}</span></span>`:'<span class="muted" style="display:block;margin-top:6px">Noch keine Ausgabe heute.</span>'}`,
    list.length?list.map(([x,i])=>exRow(x,i,x.ts>=td)).join(''):'<span class="muted">Noch keine Ausgabe diese Woche.</span>')
  +`<section class="card"><div class="meta" style="margin-top:0"><span class="muted">Gespeicherte Ausgaben</span><button class="link" style="margin:0" onclick="S.edit=!S.edit;render()">${S.edit?'Fertig':'Bearbeiten'}</button></div>
    <div class="row" style="align-items:center;margin-top:10px"><span class="muted" style="flex:1">Menge pro Tipp</span><input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Menge pro Tipp" style="max-width:76px"></div>
    <div class="chips">${S.items.length?S.items.map((x,i)=>`<button class="chip" onclick="${S.edit?`del(${i})`:`use(${i})`}">${x.n} ${eur(x.p)}${S.edit?' '+ic('x',12):''}</button>`).join(''):'<span class="muted">Noch nichts gespeichert. Trage eine Ausgabe mit Namen ein.</span>'}</div>
    <button class="btn wide" onclick="expForm()">${ic('plus',16)} Ausgabe eintragen</button></section>`;
}

/* ---------- Mein Monat ---------- */
function monat(){
  const a=avail(),me=monthEx(),sp=r2(sum(me)),rest=r2(a-sp),p=pctOf(rest,a),dl=mDays()-new Date().getDate()+1;
  const cur={ts:S.wkTs,kw:kw(S.wkTs),b:budget(),s:spentW(),cur:1},all=[...S.weeks.slice(-5),cur];
  const wline=w=>{const f=w.b>0?Math.min(100,w.s/w.b*100):0,neg=w.s>w.b+.004;
    return `<div class="wrow"><div class="sl"><span><b>W${w.kw}</b> <span class="muted">${dm(w.ts)}–${dm(atDay(w.ts,6))}</span></span>${w.cur?'<span class="muted">läuft</span>':neg?`<span class="neg">−${eur(w.s-w.b)}</span>`:`<span class="pos">+${eur(w.b-w.s)}${w.r==='save'?' gespart':w.r==='carry'?' übertragen':''}</span>`}</div>
    <div class="bar s" style="margin-top:6px"><i class="${w.cur?'cur':neg?'bad':''}" style="width:${neg?100:f}%"></i></div><div class="muted" style="font-size:.78rem;margin-top:4px">${eur(w.s)} von ${eur(w.b)}</div></div>`};
  const ct=CATS.map(c=>[c,r2(sum(me.filter(x=>x.c===c)))]).filter(x=>x[1]>0),segs=ct.map(([c,v])=>`<i style="width:${v/sp*100}%;background:${CAT[c].c}"></i>`).join('');
  const segbar=`<span class="seg" role="img" aria-label="${ct.map(([c,v])=>c+' '+eur(v)).join(', ')||'Keine Ausgaben'}">${segs}</span>`;
  return hero(`${monthName()} noch übrig`,ring(a>0?rest/a:0,eur(rest),'von '+eur(a)),
    `<span class="lbl">Pro Tag · ${dl===1?'1 Tag':dl+' Tage'}</span><span class="val">${eur(Math.max(0,Math.floor(rest/dl*100)/100))}</span><span class="pct ${pcls(p)}">${p} % frei</span>`)
  +(S.fixed+S.save>S.income?warn('margin-bottom:24px'):'')
  +xcard('x1a','So kommt dein Budget zustande','Antippen für Details',
    `<span class="sl"><span class="muted">${eur0(S.income)} − ${eur0(S.fixed)} − ${eur0(S.save)}</span><span class="big2">${eur(a)}</span></span>`,
    `<div class="sl"><span>Einkommen</span><span>${eur(S.income)}</span></div><div class="sl"><span>Fixkosten</span><span>−${eur(S.fixed)}</span></div><div class="sl"><span>Sparziel</span><span>−${eur(S.save)}</span></div>
     <div class="sl" style="border-top:1px solid var(--c4);padding-top:8px;margin-top:8px"><b>Verfügbar im Monat</b><span class="big2" style="font-size:1.2rem">${eur(a)}</span></div>
     <div class="muted" style="margin-top:8px">Pro Woche ${eur(wbase())} · pro Tag ${eur(base())} (${mDays()} Tage)</div>`)
  +xcard('x1b','Wochen im Überblick',`Streak ${S.streak}`,
    `<span class="mini">${all.slice(-3).map(w=>`<span><small>W${w.kw}</small><span class="bar s" style="display:block"><i class="${w.cur?'cur':w.s>w.b+.004?'bad':''}" style="width:${w.b>0?Math.min(100,w.s/w.b*100):0}%"></i></span></span>`).join('')}</span>`,
    all.slice().reverse().map(wline).join(''))
  +xcard('x1c','Wohin das Geld ging',`${eur(sp)} ausgegeben`,segbar,
    sp>0?segbar+ct.map(([c,v])=>`<div class="leg"><span class="d" style="background:${CAT[c].c}"></span><span>${c}</span><b>${eur(v)}</b></div>`).join(''):'<span class="muted">Noch keine Ausgaben in diesem Monat.</span>')
  +`<button class="btn soft wide" style="margin:0 0 24px" onclick="settings()">Einkommen & Ziele ändern</button>
  <button class="lock" onclick="pay()"><span>Schwankt dein Einkommen? Unregelmäßiges Einkommen gibt es mit Premium.</span>${ic('lock')}</button>
  <div class="chips" style="margin-top:0"><button class="chip" onclick="demo()">Demo: Streak auf Woche 7</button><button class="chip" onclick="rollover()">Demo: Wochenwechsel simulieren</button><button class="chip" onclick="demoData()">Demo-Daten laden</button></div>`;
}

/* ---------- Sparen ---------- */
function sparen(){
  const g=S.goal,p=pctOf(S.saved,g),got=MED.filter(m=>S.best>=m[0]).length,nx=MED.find(x=>x[0]>S.streak),ni=nx?MED.indexOf(nx):MED.length-1;
  const dep=S.dep.slice().reverse(),ms=monthStart(),mSum=r2(S.dep.filter(x=>x.ts>=ms).reduce((s,x)=>s+x.a,0));
  return hero('Sparkonto',ring(g>0?S.saved/g:0,eur(S.saved),'von '+eur(g)),
    `<span class="lbl">Sparziel</span><span class="val">${eur(g)}</span><span class="pct g">${p} % erreicht</span><span class="clock">${S.saved>=g?'Ziel erreicht':'noch '+eur(r2(g-S.saved))}</span>`)
  +`<section class="card"><h3><span>Am Montag entscheidest du</span><span class="muted" style="display:inline-flex;align-items:center;gap:6px">${ic('clock',14)}<span class="cd">${cdText()}</span></span></h3>
    <div class="muted">Aktueller Wochenrest: aufs Sparkonto oder in die nächste Woche?</div><div class="big2" style="margin-top:6px">${eur(Math.max(0,left()))}</div></section>`
  +xcard('x2a',nx?`${nx[1]} bei Woche ${nx[0]}`:'Alle Medaillen geschafft',`${S.streak?wk(S.streak)+' Streak':'Noch keine Streak'} · ${got} von ${MED.length} Medaillen`,
    `<span class="streak">${mi(ni,44)}<span class="t"><span class="bar" style="display:block"><i style="width:${nx?Math.min(100,S.streak/nx[0]*100):100}%"></i></span><span class="muted" style="display:block;margin-top:6px">${nx?`Noch ${wk(nx[0]-S.streak)}`:'Rekord '+wk(S.best)}</span></span></span>`,
    `<div class="mgrid">${MED.map((m,i)=>{const on=S.best>=m[0];return `<div class="m ${on?'on':''}"><span class="e">${mi(i,46)}</span><b>${m[1]}</b><small>${on?'ab Woche '+m[0]:'noch '+wk(m[0]-S.streak)}</small></div>`}).join('')}</div>
     <div class="muted" style="margin-top:12px">Jede Marke zählt Wochen in Folge, in denen du im Budget bleibst. Rekord: ${wk(S.best)}.</div>`)
  +xcard('x2b','Einzahlungen',dep.length?`Diesen Monat +${eur(mSum)}`:'Antippen für Details',
    dep.length?`<span class="sl"><span>${dep[0].n} <span class="muted">· ${dm(dep[0].ts)}</span></span><span class="pos">+${eur(dep[0].a)}</span></span>`:'<span class="muted">Noch keine Einzahlung.</span>',
    dep.length?dep.map(x=>`<div class="sl" style="padding:4px 0"><span>${x.n} <span class="muted">· ${dm(x.ts)}</span></span><span class="pos">+${eur(x.a)}</span></div>`).join(''):'<span class="muted">Noch keine Einzahlung.</span>')
  +`<button class="btn wide" style="margin:0 0 24px" onclick="depForm()">${ic('plus',16)} Auf Sparkonto einzahlen</button>
  <button class="lock" onclick="pay()"><span>${ic('plus')} Weitere Sparziele</span><span>${ic('lock')} Premium</span></button>
  <button class="lock" onclick="pay()"><span>${ic('chart')} Statistik nach Kategorien</span><span>${ic('lock')} Premium</span></button>`;
}

/* ---------- Aktionen ---------- */
function render(all){
  $('#day').textContent='Woche '+kw(Date.now());
  [uebersicht,monat,sparen].forEach((f,i)=>{if(all||i===idx)$('#p'+i).innerHTML=f()});
  save();navUpd();
}
function spend(n,p,q,c){S.ex.push({n,p,q,c,ts:Date.now(),w:S.wkN});render()}
function use(i){const x=S.items[i],q=Math.max(1,parseInt(($('#qty')||{}).value)||1);spend(x.n,x.p,q,x.c||'Sonstiges');toast(`${q>1?q+'× ':''}${x.n} eingetragen`)}
function del(i){S.items.splice(i,1);render()}
function undo(i){S.ex.splice(i,1);render()}
let fCat='Sonstiges';
function expForm(){
  fCat='Sonstiges';
  modal(`<h3>Ausgabe eintragen</h3>
    <input id="nm" type="text" placeholder="Name, z. B. Wocheneinkauf" aria-label="Name">
    <div class="row" style="margin-top:10px"><input id="fq" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Menge" style="max-width:76px"><input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Preis €" aria-label="Preis pro Stück"></div>
    <div class="muted" style="margin-top:12px">Kategorie</div>
    <div class="chips" role="radiogroup" aria-label="Kategorie" id="cats">${catChips()}</div>
    <button class="btn wide" onclick="add()">Eintragen</button>
    <div class="muted" style="margin-top:8px">Menge × Preis pro Stück. Mit Namen wird die Ausgabe gespeichert.</div>
    <button class="link" onclick="closeM()">Abbrechen</button>`);
}
const catChips=()=>CATS.map(c=>`<button class="chip${c===fCat?' sel':''}" role="radio" aria-checked="${c===fCat}" onclick="fCat='${c}';$('#cats').innerHTML=catChips()">${ic(CAT[c].i,14)} ${c}</button>`).join('');
function add(){
  const v=parseFloat(String($('#amt').value).replace(',','.')),raw=$('#nm').value.trim(),n=raw||'Ausgabe',q=Math.max(1,parseInt($('#fq').value)||1);
  if(!(v>0)){$('#amt').focus();return}
  const x=S.items.find(y=>y.n.toLowerCase()===n.toLowerCase()&&y.p===v);
  if(!x&&raw)S.items.push({n,p:v,c:fCat});
  closeM();spend(n,v,q,fCat);toast(`${n} eingetragen`);
}
function settings(){
  const f=(k,t)=>`<label>${t}<input type="number" inputmode="decimal" value="${S[k]}" oninput="setv('${k}',this.value)"></label>`;
  modal(`<h3>Einkommen & Ziele</h3>${f('income','Einkommen pro Monat (€)')}${f('fixed','Fixkosten: Miete, Handy, Abos (€)')}${f('save','Sparziel pro Monat (€)')}${f('goal','Sparkonto-Ziel (€)')}${f('min','Warnen, wenn pro Tag weniger übrig ist als (€)')}
    <div id="setres" class="muted">${setRes()}</div><button class="btn wide" onclick="closeM()">Fertig</button>`);
}
const setRes=()=>`Wochenbudget: <b>${eur(wbase())}</b> · pro Tag ${eur(base())}`;
function setv(k,v){S[k]=Math.max(0,parseFloat(v)||0);if(k==='goal'&&!S.goal)S.goal=1;render(true);const e=$('#setres');if(e)e.innerHTML=setRes()}
function depForm(){
  modal(`<h3>Auf Sparkonto einzahlen</h3><input id="dep" type="number" inputmode="decimal" step="0.01" placeholder="Betrag €" aria-label="Betrag">
    <button class="btn wide" onclick="deposit()">Einzahlen</button><button class="link" onclick="closeM()">Abbrechen</button>`);
}
function deposit(){const a=r2(parseFloat(String($('#dep').value).replace(',','.')));if(!(a>0)){$('#dep').focus();return}S.saved=r2(S.saved+a);S.dep.push({ts:Date.now(),n:'Einzahlung',a});closeM();render(true);toast(`${eur(a)} eingezahlt`)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').hidden=false;const f=$('#sheet input,#sheet button');if(f&&matchMedia('(pointer:fine)').matches)f.focus()}
function closeM(){$('#modal').hidden=true}
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}
function ask(){
  if(!(S.pending>0))return;
  modal(`<h3>Letzte Woche blieben ${eur(S.pending)} übrig</h3><p class="muted">Rest aufs Sparkonto oder in die nächste Woche?</p>
    <button class="btn wide" onclick="answer('carry')">${ic('arrow',18)} In die neue Woche übertragen</button>
    <button class="btn soft wide" onclick="answer('save')">${mi(1,26)} Aufs Sparkonto legen</button>`);
}
function showMedal(){const m=MED[S.medalQ];S.medalQ=null;if(!m)return false;save();setTimeout(()=>medal(m),300);return true}
function onOpen(){if(S.pending>0)ask();else showMedal()}
function answer(c){
  const a=S.pending,w=S.weeks.filter(x=>x.r===null).pop();S.pending=0;
  if(c==='save'){S.saved=r2(S.saved+a);S.dep.push({ts:Date.now(),n:'Rest Woche '+(w?w.kw:kw(atDay(S.wkTs,-7))),a})}else S.carry=r2(S.carry+a);
  if(w)w.r=c;
  closeM();render(true);
  if(!showMedal()&&c==='save'&&!S.paySeen){S.paySeen=true;setTimeout(pay,300)}
}
function rollover(silent){
  if(S.pending>0){S.carry=r2(S.carry+S.pending);S.pending=0;S.weeks.forEach(x=>{if(x.r===null)x.r='carry'})}
  const gap=Math.max(1,Math.round((weekStart()-S.wkTs)/(7*D))),l=left();let m=-1;
  S.weeks.push({ts:S.wkTs,kw:kw(S.wkTs),b:r2(budget()),s:spentW(),r:l>0?null:l<0?'minus':'zero'});S.weeks=S.weeks.slice(-12);
  if(gap>2||l<0)S.streak=0;
  else{S.streak++;S.best=Math.max(S.best,S.streak);m=MED.findIndex(x=>x[0]===S.streak)}
  S.medalQ=m>=0?m:S.medalQ;S.pending=l>0?l:0;S.carry=l<0?l:0;
  S.wkN++;S.wkTs=weekStart();const old=Date.now()-120*D;S.ex=S.ex.filter(x=>x.ts>old);
  closeM();render(true);
  if(!silent)push(`Neue Woche! Dein Wochenbudget: ${eur(budget())}`+(S.pending>0?`. Letzte Woche blieben ${eur(S.pending)} übrig.`:l<0?`. Das Minus der letzten Woche (${eur(l)}) wurde abgezogen.`:''));
}
let pushT;
function push(t){const e=$('#push');$('#pushtxt').textContent=t;e.hidden=false;clearTimeout(pushT);pushT=setTimeout(()=>e.hidden=true,9000)}
function openPush(){$('#push').hidden=true;onOpen()}
function tick(){if(S.wkTs!==weekStart())rollover();const t=cdText();document.querySelectorAll('.cd').forEach(e=>e.textContent=t)}
setInterval(tick,1000);
function medal(m){modal(`<div style="text-align:center">${mi(MED.indexOf(m),110)}</div><h3 style="justify-content:center">Neue Medaille: ${m[1]}</h3><p class="muted">${wk(m[0])} in Folge im Budget geblieben. Weiter so!</p><button class="btn wide" onclick="closeM()">Super</button>`)}
function demo(){S.streak=7;S.best=Math.max(S.best,7);render(true);toast('Streak steht auf 7 Wochen. Simuliere den Wochenwechsel für die nächste Medaille.')}
function demoData(){
  const W=S.wkTs,w1=atDay(W,-14),w2=atDay(W,-7),now=Date.now(),td=atDay(now),ti=(new Date().getDay()+6)%7,h=(t,hh,mm=0)=>t+hh*36e5+mm*6e4;
  const e=(n,p,q,c,ts,w)=>({n,p,q,c,ts,w});
  S.ex=[e('Wocheneinkauf',38.5,1,'Einkauf',h(w1,17,20),S.wkN-2),e('Mensa',5.5,3,'Essen',h(atDay(w1,2),12,30),S.wkN-2),e('Kaffee',2.8,2,'Getränke',h(atDay(w1,3),9),S.wkN-2),
    e('Wocheneinkauf',41.2,1,'Einkauf',h(atDay(w2,1),18),S.wkN-1),e('Mensa',5.5,3,'Essen',h(atDay(w2,3),12,15),S.wkN-1),e('Kino',11,1,'Sonstiges',h(atDay(w2,5),20),S.wkN-1),e('Cola Zero',1,3,'Getränke',h(atDay(w2,4),15),S.wkN-1),
    e('Wocheneinkauf',29.4,1,'Einkauf',h(atDay(W,Math.min(1,ti)),18,20),S.wkN),e('Kaffee',2.8,1,'Getränke',h(td,9,10),S.wkN),e('Cola Zero',1,1,'Getränke',Math.min(now,h(td,10,30)),S.wkN)];
  S.weeks=[{ts:w1,kw:kw(w1),b:81.69,s:61.69,r:'save'},{ts:w2,kw:kw(w2),b:81.69,s:74.19,r:'carry'}];
  S.dep=[{ts:h(monthStart(),9),n:'Sparziel '+monthName(),a:100},{ts:h(w2,8),n:'Rest Woche '+kw(w1),a:20}];
  S.saved=120;S.streak=2;S.best=Math.max(S.best,2);S.carry=7.5;S.pending=0;render(true);toast('Demo-Daten geladen');
}
function pay(){
  modal(`<h3>${S.saved>0?'Du hast '+eur(S.saved)+' gespart':'My Weekly Budget Premium'}</h3>
    <p class="muted">Mehrere Sparziele, Statistik nach Kategorien und unregelmäßiges Einkommen.</p>
    <div class="plans">
      <button class="plan ${S.plan==='y'?'sel':''}" onclick="pick('y')"><b>Jahr</b><span>14,99 €</span><small>etwa 1,25 € pro Monat</small></button>
      <button class="plan ${S.plan==='m'?'sel':''}" onclick="pick('m')"><b>Monat</b><span>2,99 €</span><small>jederzeit kündbar</small></button></div>
    <button class="btn wide" onclick="buy()">10 Tage gratis testen</button>
    <div class="muted fine">Danach ${S.plan==='y'?'14,99 €/Jahr':'2,99 €/Monat'}, jederzeit kündbar</div>
    <button class="link" onclick="closeM()">Nicht jetzt</button>`);
}
function pick(p){S.plan=p;save();pay()}
function buy(){closeM();toast('Nur ein Prototyp: Hier startet später der Kauf.')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* Wischen: Panels folgen dem Finger, danach gleitet die Ansicht ein */
const TABS=3,wrap=$('#wrap'),track=$('#track');
let idx=0,drag=null,quiet=false,wt;
const pos=x=>{track.style.transform=`translateX(calc(${-idx*100/TABS}% + ${x||0}px))`};
const navUpd=()=>document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('on',i===idx);b.setAttribute('aria-current',i===idx?'page':'false')});
const fit=()=>{wrap.style.height=$('#p'+idx).offsetHeight+'px'};
function setTab(n){
  n=Math.max(0,Math.min(TABS-1,n));const ch=n!==idx;idx=n;if(ch)OPEN.fill(null);render(true);
  wrap.style.transition='height .42s cubic-bezier(.22,1,.36,1)';track.style.transition='transform .42s cubic-bezier(.22,1,.36,1)';pos(0);fit();
  clearTimeout(wt);wt=setTimeout(()=>{wrap.style.transition='none'},480);
  if(ch)window.scrollTo({top:0,behavior:'smooth'});
}
wrap.addEventListener('pointerdown',e=>{if(!$('#modal').hidden||e.target.closest('input'))return;drag={x:e.clientX,y:e.clientY,t:Date.now(),lock:0,d:0}});
wrap.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.lock){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){drag.lock=1;try{wrap.setPointerCapture(e.pointerId)}catch(_){}track.style.transition='none'}
    else if(Math.abs(dy)>10){drag=null;return}
  }
  if(drag.lock){const edge=(idx===0&&dx>0)||(idx===TABS-1&&dx<0);drag.d=edge?dx*.3:dx;pos(drag.d)}
});
const end=()=>{
  if(!drag)return;const d=drag;drag=null;if(!d.lock)return;
  quiet=true;setTimeout(()=>quiet=false,80);
  const w=wrap.offsetWidth,v=Math.abs(d.d)/(Date.now()-d.t+1),go=Math.abs(d.d)>24&&(Math.abs(d.d)>w*.22||v>.5);
  setTab(idx+(go?(d.d<0?1:-1):0));
};
wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
document.addEventListener('click',e=>{if(quiet){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')closeM();return}if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowRight')setTab(idx+1);if(e.key==='ArrowLeft')setTab(idx-1)});
document.querySelectorAll('.panel').forEach(p=>new ResizeObserver(fit).observe(p));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.pending>0&&$('#modal').hidden)ask()}});
setTab(0);
if(S.wkTs!==weekStart())rollover(true);
if(S.pending>0)ask();else showMedal();
</script>

</body></html>
